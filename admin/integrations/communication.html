  <!-- CRUX · Admin session guard (blocks render until verified) -->
  <script>
    (function () {
      // Hide body until session is verified (prevents flash of content).
      var styleEl = document.createElement('style');
      styleEl.id = 'crux-admin-guard-style';
      styleEl.textContent = 'body{visibility:hidden}html{background:#0E1A2B}#crux-guard-veil{position:fixed;inset:0;z-index:999999;background:#0E1A2B;color:#3869AB;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.25em;text-transform:uppercase;visibility:visible}';
      document.head.appendChild(styleEl);

      // Veil mounted after DOM ready
      document.addEventListener('DOMContentLoaded', function () {
        if (document.getElementById('crux-guard-veil')) return;
        var veil = document.createElement('div');
        veil.id = 'crux-guard-veil';
        veil.textContent = 'Verificando sesión…';
        document.body.appendChild(veil);
      });

      // Dev-only bypass: en localhost + ?__preview, saltar verificación
      var isLocal = /^(localhost|127\.0\.0\.1|0\.0\.0\.0)$/.test(window.location.hostname);
      var wantsPreview = new URLSearchParams(window.location.search).has('__preview');
      var reveal = function (profile) {
        var s = document.getElementById('crux-admin-guard-style');
        if (s) s.remove();
        var v = document.getElementById('crux-guard-veil');
        if (v) v.remove();
        // Expone el perfil para que la app React lo consuma sin un segundo fetch
        window.__cruxProfile = profile || null;
      };
      if (isLocal && wantsPreview) {
        reveal({
          username: 'preview@localhost',
          name: 'Preview Local',
          role: 'admin',
          color: '#3869AB',
          access: ['*'],
          isAdmin: true,
        });
        return;
      }

      fetch('/api/auth/me', { method: 'GET', credentials: 'same-origin', cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('unauth');
          return r.json();
        })
        .then(function (profile) {
          var access = Array.isArray(profile.access) ? profile.access : [];
          var hasAccess = access.includes('*') || access.includes('communication');
          if (!hasAccess) {
            window.location.replace('/admin/hub');
            return;
          }
          reveal(profile);
        })
        .catch(function () {
          window.location.replace('/admin');
        });
    })();
  </script>

  <script type="text/babel" data-presets="react">
    /** @jsxRuntime classic */
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    /* ─── Identidad del usuario logueado ─── */
    // Lee el perfil que el guard del <head> dejó en window.__cruxProfile.
    // Si no está disponible (no debería pasar en producción), hace fetch al endpoint.
    function useCurrentUser() {
      const [profile, setProfile] = useState(() => window.__cruxProfile || null);
      useEffect(() => {
        if (profile) return;
        let cancelled = false;
        fetch('/api/auth/me', { credentials: 'same-origin', cache: 'no-store' })
          .then(r => r.ok ? r.json() : null)
          .then(p => { if (!cancelled && p) setProfile(p); })
          .catch(() => {});
        return () => { cancelled = true; };
      }, []);
      return profile;
    }

    /* ─── Lista pública del equipo ─── */
    let __teamCache = null;
    let __teamPromise = null;
    function fetchTeam() {
      if (__teamCache) return Promise.resolve(__teamCache);
      if (__teamPromise) return __teamPromise;
      __teamPromise = fetch('/api/auth/team', { credentials: 'same-origin', cache: 'no-store' })
        .then(r => r.ok ? r.json() : { team: [] })
        .then(json => { __teamCache = json.team || []; return __teamCache; })
        .catch(() => []);
      return __teamPromise;
    }

    function useTeam() {
      const [team, setTeam] = useState(__teamCache || []);
      useEffect(() => {
        let cancelled = false;
        fetchTeam().then(t => { if (!cancelled) setTeam(t); });
        return () => { cancelled = true; };
      }, []);
      return team;
    }

    /* ─── Mapeo del shape /api/auth/team a la forma que esperan los componentes ─── */

        iniciales: m.name ? m.name.trim().split(/\s+/).map(s => s[0] || '').join('').slice(0,2).toUpperCase() : '??',
        rol: m.role === 'admin' ? 'admin' : 'member',
        color: m.color,
        gmail: m.username,
      }));
    }

    function getMetricasCliente(store, clienteId) {
      const proyectos = store.getProyectos(clienteId);
      const its = proyectos.flatMap(p => store.getIteraciones(p.id, { incluirArchivadas: true }));
      const pendientes = its.filter(it => it.estado === "pendiente").length;

      const orden = { saludable: 0, atencion: 1, riesgo: 2 };
      const peor = proyectos.reduce((acc, p) => orden[p.salud] > orden[acc] ? p.salud : acc, "saludable");
      return { numProyectos: proyectos.length, pendientes, proceso, salud: peor };

      if (!iso) return "—";
      const d = new Date(iso);
      const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
      const hh = String(d.getHours()).padStart(2, "0");

    function makeStore() {
      let state = null;                   // null hasta hidratar desde KV
      let saveTimer = null;
      let saving = false;
      let saveError = null;
      const listeners = new Set();
      const SAVE_DEBOUNCE_MS = 800;
      const MAX_RETRIES = 3;

      function notify() { listeners.forEach(fn => fn()); }
      function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

      async function hydrate() {
        const r = await fetch('/api/comm-state', { credentials: 'same-origin', cache: 'no-store' });
        if (r.status === 404) {
          state = SEED();
          await persistNow();             // crea snapshot inicial en KV
        } else if (r.ok) {
          const { data } = await r.json();
          state = data;
        } else {
          throw new Error('hydrate failed: ' + r.status);
        }
        notify();
      }

      function persist() {
        clearTimeout(saveTimer);
        saveError = null;                 // si había error previo, el usuario está editando de nuevo
        saveTimer = setTimeout(persistNow, SAVE_DEBOUNCE_MS);
        notify();                         // UI re-renderiza inmediato con el cambio in-memory
      }

      async function persistNow(attempt) {
        attempt = attempt || 1;
        saving = true;
        if (attempt === 1) saveError = null;
        notify();
        try {
          const r = await fetch('/api/comm-state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ data: state }),
          });
          if (!r.ok) throw new Error('save failed: ' + r.status);
          saving = false;
          notify();
        } catch (e) {
          console.error('[comm-store] save attempt ' + attempt + ' failed', e);
          if (attempt < MAX_RETRIES) {
            // mantener saving=true durante el retry — la UI sigue mostrando Guardando
            const backoff = Math.pow(2, attempt) * 500;   // 1s, 2s, 4s
            setTimeout(() => persistNow(attempt + 1), backoff);
          } else {
            saveError = e.message || 'save failed';
            saving = false;
            notify();
          }
        }
      }

      return {
        subscribe,
        hydrate,
        isReady: () => state !== null,
        isSaving: () => saving,
        saveError: () => saveError,
        retryLastSave: () => persistNow(),
        getState: () => state,
        reset: async () => { state = SEED(); await persistNow(); notify(); },
        clear: async () => { state = SEED(); await persistNow(); notify(); },

        /* Clientes */
        getClientes: () => state.clientes.slice(),
        getCliente: (id) => state.clientes.find(c => c.id === id),
        addCliente: (data) => { const c = { id: genId("cli"), nombre: "", notas: "", fechaAlta: todayISO(), archivado: false, fechaArchivado: null, ...data }; state.clientes.push(c); persist(); return c; },
        updateCliente: (id, patch) => { state.clientes = state.clientes.map(c => c.id === id ? { ...c, ...patch } : c); persist(); return state.clientes.find(c => c.id === id); },
        deleteCliente: (id) => { state.clientes = state.clientes.filter(c => c.id !== id); state.proyectos.filter(p => p.clienteId === id).forEach(p => state.iteraciones = state.iteraciones.filter(it => it.proyectoId !== p.id)); state.proyectos = state.proyectos.filter(p => p.clienteId !== id); persist(); },

        /* Proyectos */
        getProyectos: (clienteId) => state.proyectos.filter(p => p.clienteId === clienteId),
        getProyecto: (id) => state.proyectos.find(p => p.id === id),
        addProyecto: (clienteId, data) => {
          const p = {
            id: genId("proy"), clienteId, nombre: "", url: "", tipoPropuesta: "",
            fechaAlta: todayISO(), fechaEntrega: "",
            stack: { frontend: "", backend: "", hosting: "", dominioDNS: "" },
            briefing: "", salud: "saludable", bloqueoActual: "",
            equipoIds: [], hitos: [],
            ...data,
          };
          state.proyectos.push(p); persist(); return p;
        },
        updateProyecto: (id, patch) => { state.proyectos = state.proyectos.map(p => p.id === id ? { ...p, ...patch } : p); persist(); return state.proyectos.find(p => p.id === id); },
        deleteProyecto: (id) => { state.proyectos = state.proyectos.filter(p => p.id !== id); state.iteraciones = state.iteraciones.filter(it => it.proyectoId !== id); persist(); },

        /* Iteraciones */
        getIteraciones: (proyectoId, { incluirArchivadas = false } = {}) => {
          let arr = state.iteraciones.filter(it => it.proyectoId === proyectoId);
          if (!incluirArchivadas) arr = arr.filter(it => it.estado !== "hecha" && it.estado !== "descartada");
          return arr.slice().sort((a, b) => b.fechaCreacion.localeCompare(a.fechaCreacion));
        },
        getIteracion: (id) => state.iteraciones.find(it => it.id === id),
        addIteracion: (proyectoId, data) => {
          const it = {
            id: genId("it"), proyectoId, descripcion: "", fechaCreacion: nowISO(),
            autorId: null, tipo: "otro", estado: "pendiente", asignadoId: null,
            fechaArchivado: null, enlace: "", comentarios: [], hitoId: null, ...data,
          };
          state.iteraciones.push(it); persist(); return it;
        },
        updateIteracion: (id, patch) => {
          state.iteraciones = state.iteraciones.map(it => {
            if (it.id !== id) return it;
            const next = { ...it, ...patch };
            if ((patch.estado === "hecha" || patch.estado === "descartada") && !it.fechaArchivado) next.fechaArchivado = nowISO();
            if (patch.estado === "pendiente" || patch.estado === "en_proceso") next.fechaArchivado = null;
            return next;
          });
          persist();
          return state.iteraciones.find(it => it.id === id);
        },
        deleteIteracion: (id) => { state.iteraciones = state.iteraciones.filter(it => it.id !== id); persist(); },

        /* Hitos del proyecto */
        getHito: (proyectoId, hitoId) => {
          if (hitoId == null) return null;
          const p = state.proyectos.find(x => x.id === proyectoId);
          return p ? (p.hitos || []).find(h => h.id === hitoId) : undefined;
        },
        getIteracionesPorHito: (proyectoId, hitoId, { incluirArchivadas = false } = {}) => {
          let arr = state.iteraciones.filter(it => it.proyectoId === proyectoId && (it.hitoId || null) === (hitoId || null));
          if (!incluirArchivadas) arr = arr.filter(it => it.estado !== "hecha" && it.estado !== "descartada");
          return arr.slice().sort((a, b) => b.fechaCreacion.localeCompare(a.fechaCreacion));
        },
        setHitoIteracion: (iteracionId, hitoId) => {
          const it = state.iteraciones.find(x => x.id === iteracionId);
          if (!it) return;
          if (hitoId != null) {
            const p = state.proyectos.find(x => x.id === it.proyectoId);
            const ok = p && (p.hitos || []).some(h => h.id === hitoId);
            if (!ok) { console.warn("setHitoIteracion: hitoId no pertenece al proyecto de la iteración", { iteracionId, hitoId }); return; }
          }
          state.iteraciones = state.iteraciones.map(x => x.id === iteracionId ? { ...x, hitoId: hitoId || null } : x);
          persist();
        },
        addHitoEnProyecto: (proyectoId, data) => {
          const nuevo = { id: genId("hito"), nombre: "", fecha: todayISO(), descripcion: "", cumplido: false, ...data };
          state.proyectos = state.proyectos.map(p => p.id === proyectoId ? { ...p, hitos: [...(p.hitos || []), nuevo] } : p);
          persist();
          return nuevo;
        },
        deleteHito: (proyectoId, hitoId) => {
          state.proyectos = state.proyectos.map(p => p.id === proyectoId ? { ...p, hitos: (p.hitos || []).filter(h => h.id !== hitoId) } : p);
          state.iteraciones = state.iteraciones.map(it => (it.proyectoId === proyectoId && it.hitoId === hitoId) ? { ...it, hitoId: null } : it);
          persist();
        },

        /* Comentarios */
        addComentario: (iteracionId, data) => {
          const c = { id: genId("c"), autorId: null, texto: "", fecha: nowISO(), ...data };
          state.iteraciones = state.iteraciones.map(it => it.id === iteracionId ? { ...it, comentarios: [...it.comentarios, c] } : it);
          persist();
          return c;
        },
        deleteComentario: (iteracionId, comentarioId) => {
          state.iteraciones = state.iteraciones.map(it => it.id === iteracionId ? { ...it, comentarios: it.comentarios.filter(c => c.id !== comentarioId) } : it);
          persist();
        },

        /* Backup */
        export: () => JSON.stringify(state, null, 2),
        import: (jsonStr) => { state = JSON.parse(jsonStr); persistNow(); notify(); },
      };
    }

    /* Hook React para suscribirse al store */
    function useStore(store) {
      const [, force] = useState(0);
      useEffect(() => store.subscribe(() => force(n => n + 1)), [store]);
      return store;
    }

    /* Instancia global */
    const store = makeStore();

    /* ─── Helpers de hito ─── */
    function hitoUrgencia(hito) {
      if (!hito) return "ninguno";
      if (hito.cumplido) return "cumplido";
      if (!hito.fecha) return "sin-fecha";
      const dias = diasHasta(hito.fecha);
      if (dias < 0) return "atrasado";
      if (dias <= 7) return "proximo";
      return "lejano";
    }

    function hitoColor(urgencia) {
      switch (urgencia) {
        case "cumplido": return { fg: C.green, bg: C.greenBg, border: C.green };
        case "atrasado": return { fg: C.red, bg: C.redBg, border: C.red };
        case "proximo":  return { fg: C.amber, bg: C.amberBg, border: C.amber };
        case "lejano":   return { fg: C.textSec, bg: "transparent", border: C.border };
        case "sin-fecha":return { fg: C.textSec, bg: "transparent", border: C.border };
        default:         return { fg: C.textDim, bg: "transparent", border: C.border };
      }
    }

    function HitoChip({ hito, onClick, compact = false }) {

    /* ─── ConfirmDialog (custom dark, sustituye al window.confirm nativo) ─── */
    const _confirmRef = { current: null };
    function askConfirm(opts) {
      const o = typeof opts === "string" ? { body: opts } : (opts || {});
      if (_confirmRef.current) return _confirmRef.current(o);
      return Promise.resolve(window.confirm(o.body || o.title || ""));
    }

    function ConfirmDialog() {
      const [state, setState] = useState(null);
      const confirmBtnRef = useRef(null);

      useEffect(() => {
        _confirmRef.current = (opts) => new Promise((resolve) => setState({ opts, resolve }));
        return () => { _confirmRef.current = null; };
      }, []);

      useEffect(() => {
        if (!state) return;
        const finish = (result) => { state.resolve(result); setState(null); };
        const t = setTimeout(() => confirmBtnRef.current && confirmBtnRef.current.focus(), 0);
        const onKey = (e) => {
          if (e.key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); finish(false); }
          else if (e.key === "Enter") { e.preventDefault(); e.stopImmediatePropagation(); finish(true); }
        };
        document.addEventListener("keydown", onKey, true);
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        return () => {
          clearTimeout(t);
          document.removeEventListener("keydown", onKey, true);
          document.body.style.overflow = prevOverflow;
        };
      }, [state]);

      if (!state) return null;
      const close = (result) => { state.resolve(result); setState(null); };
      const o = state.opts;
      const title = o.title || "¿Confirmar acción?";
      const body = o.body || "";
      const confirmText = o.confirmText || "Aceptar";
      const cancelText = o.cancelText || "Cancelar";
      const danger = !!o.danger;
      return (
        <div onClick={() => close(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", backdropFilter: "blur(3px)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 2000 }}>
          <div onClick={(e) => e.stopPropagation()} role="alertdialog" aria-modal="true" aria-labelledby="confirm-dlg-title" style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, width: 420, maxWidth: "90vw", boxShadow: "0 24px 64px rgba(0,0,0,0.6)", overflow: "hidden" }}>
            <div style={{ padding: "20px 22px 18px" }}>
              <div id="confirm-dlg-title" style={{ fontSize: 15, fontWeight: 700, color: C.white, letterSpacing: -0.2, marginBottom: body ? 8 : 0 }}>{title}</div>
              {body && <div style={{ fontSize: 12.5, color: C.textSec, lineHeight: 1.55 }}>{body}</div>}
            </div>
            <div style={{ padding: "12px 18px", borderTop: `1px solid ${C.border}`, display: "flex", justifyContent: "flex-end", gap: 8, background: C.surface2 }}>
              <button onClick={() => close(false)} style={{ background: "transparent", color: C.textSec, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: font, letterSpacing: 0.3 }}>{cancelText}</button>
              <button ref={confirmBtnRef} onClick={() => close(true)} style={{
                background: danger ? `${C.red}1f` : C.accent,
                color: danger ? C.red : C.white,
                border: `1px solid ${danger ? C.red + "88" : C.accent}`,
                borderRadius: 6, padding: "7px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: font, letterSpacing: 0.3,
                outline: "none", transition: "background 0.15s, box-shadow 0.15s",
              }} onFocus={(e) => { e.currentTarget.style.boxShadow = `0 0 0 2px ${(danger ? C.red : C.accent)}55`; }} onBlur={(e) => { e.currentTarget.style.boxShadow = "none"; }}>
                {confirmText}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* Select dark personalizado (sustituye al <select> nativo que en Windows/Chrome se renderiza claro) */
    function Select({ value, onChange, options, style = {}, buttonStyle = {}, placeholder = "—" }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", close);
        return () => document.removeEventListener("mousedown", close);
      }, []);
      const current = options.find(o => o.value === value);
      return (
        <div ref={ref} style={Object.assign({ position: "relative" }, style)}>
          <button type="button" data-open={open} onClick={() => setOpen(o => !o)} className="crux-ctrl-btn" style={Object.assign({}, {
            width: "100%", justifyContent: "space-between",
          }, buttonStyle)}>
            <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: current ? C.text : C.textDim }}>{current ? current.label : placeholder}</span>
            <span style={{ color: C.textDim, fontSize: 9, flexShrink: 0 }}>▾</span>
          </button>
          {open && (
            <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, minWidth: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 4, zIndex: 200, boxShadow: "0 8px 24px rgba(0,0,0,0.5)", maxHeight: 280, overflow: "auto" }}>
              {options.map(o => (
                <button key={o.value} type="button" onClick={() => { onChange(o.value); setOpen(false); }} style={{
                  display: "flex", alignItems: "center", gap: 8, width: "100%", textAlign: "left",
                  background: o.value === value ? C.accentGlow : "transparent",
                  border: "none", padding: "7px 10px", borderRadius: 5,
                  color: o.value === value ? C.accent : C.text, fontSize: 12, fontFamily: font, cursor: "pointer", whiteSpace: "nowrap",
                }} onMouseEnter={(e) => o.value !== value && (e.currentTarget.style.background = C.surface2)} onMouseLeave={(e) => o.value !== value && (e.currentTarget.style.background = "transparent")}>
                  {o.color && <span style={{ width: 8, height: 8, borderRadius: "50%", background: o.color, flexShrink: 0 }} />}
                  <span style={{ flex: 1 }}>{o.label}</span>
                  {o.value === value && <span style={{ fontSize: 10, color: C.accent }}>✓</span>}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* MultiSelect dark con popover y pills internas. Reusa la estética de Select. */
    function MultiSelect({ values, onChange, options, label = "Filtrar", style = {}, buttonStyle = {} }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", close);
        return () => document.removeEventListener("mousedown", close);
      }, []);
      const active = values.length > 0;
      const buttonLabel = active ? `${label} · ${values.length}` : label;
      const toggle = (v) => onChange(values.includes(v) ? values.filter(x => x !== v) : [...values, v]);
      return (
        <div ref={ref} style={Object.assign({ position: "relative" }, style)}>
          <button type="button" data-open={open} data-active={active} onClick={() => setOpen(o => !o)} className="crux-ctrl-btn" style={buttonStyle}>
            <span>{buttonLabel}</span>
            <span style={{ color: active ? C.accent : C.textDim, fontSize: 9 }}>▾</span>
          </button>
          {open && (
            <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, minWidth: 200, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 4, zIndex: 200, boxShadow: "0 8px 24px rgba(0,0,0,0.5)", maxHeight: 320, overflow: "auto" }}>
              {options.map(o => {
                const selected = values.includes(o.value);
                return (
                  <button key={o.value} type="button" onClick={() => toggle(o.value)} style={{
                    display: "flex", alignItems: "center", gap: 8, width: "100%", textAlign: "left",
                    background: selected ? C.accentGlow : "transparent",
                    border: "none", padding: "7px 10px", borderRadius: 5,
                    color: selected ? C.accent : C.text, fontSize: 12, fontFamily: font, cursor: "pointer",
                  }} onMouseEnter={(e) => !selected && (e.currentTarget.style.background = C.surface2)} onMouseLeave={(e) => !selected && (e.currentTarget.style.background = "transparent")}>
                    {o.color && <span style={{ width: 8, height: 8, borderRadius: "50%", background: o.color, flexShrink: 0 }} />}
                    <span style={{ flex: 1 }}>{o.label}</span>
                    {selected && <span style={{ color: C.accent, fontSize: 11 }}>✓</span>}
                  </button>
                );
              })}
              {active && (
                <button type="button" onClick={() => onChange([])} style={{
                  width: "100%", marginTop: 4, padding: "6px 10px", fontSize: 10,
                  color: C.textDim, background: "transparent", border: `1px dashed ${C.border}`,
                  borderRadius: 5, cursor: "pointer", fontFamily: font, letterSpacing: 0.5, textTransform: "uppercase",
                }}>Limpiar selección</button>
              )}
            </div>
          )}
        </div>
      );
    }

    /* Form helpers */
    function FormField({ label, children, hint, error }) {
      return (
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 11, color: C.textDim, fontWeight: 600, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 6 }}>{label}</label>
          {children}
          {error
            ? <div style={{ fontSize: 10, color: C.red, marginTop: 4, fontWeight: 600 }}>{error}</div>
            : (hint && <div style={{ fontSize: 10, color: C.textDim, marginTop: 4 }}>{hint}</div>)}
        </div>
      );
    }
    function TextInput(props) {
      return <input {...props} style={Object.assign({}, { width: "100%", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 10px", color: C.text, fontFamily: font, fontSize: 13, outline: "none" }, props.style)} onFocus={(e) => { e.target.style.borderColor = C.accent; props.onFocus && props.onFocus(e); }} onBlur={(e) => { e.target.style.borderColor = C.border; props.onBlur && props.onBlur(e); }} />;
    }
    function TextArea(props) {
      return <textarea {...props} style={Object.assign({}, { width: "100%", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 10px", color: C.text, fontFamily: font, fontSize: 13, outline: "none", minHeight: 80, resize: "vertical" }, props.style)} onFocus={(e) => { e.target.style.borderColor = C.accent; props.onFocus && props.onFocus(e); }} onBlur={(e) => { e.target.style.borderColor = C.border; props.onBlur && props.onBlur(e); }} />;
    }
    function Btn({ kind = "ghost", children, style = {}, ...rest }) {
      return <button {...rest} className={`crux-btn crux-btn-${kind}`} style={style}>{children}</button>;
    }

    /* Iconos stroke 1.5 estilo lucide para los botones del header */
    const HeaderIcons = {
      Team: (
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="5.2" cy="5" r="2" />
          <path d="M1.8 12c0-2 1.5-3.2 3.4-3.2s3.4 1.2 3.4 3.2" />
          <circle cx="10.2" cy="4.4" r="1.6" />
          <path d="M10.2 8.4c1.7 0 2.7 1 2.7 2.5" />
        </svg>
      ),
      Gantt: (
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="2" y="3" width="6" height="2" rx="0.8" fill="currentColor" />
          <rect x="5" y="6" width="7" height="2" rx="0.8" fill="currentColor" />
          <rect x="3" y="9" width="5" height="2" rx="0.8" fill="currentColor" />
        </svg>
      ),
      Reset: (
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M12 7a5 5 0 1 1-1.4-3.5" />
          <path d="M12 1.8v3.5h-3.5" />
        </svg>
      ),
      Archive: (
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="1.5" y="2.8" width="11" height="2.6" rx="0.6" />
          <path d="M2.5 5.4v6.3h9V5.4" />
          <path d="M5.5 8h3" />
        </svg>
      ),
    };

    /* Header tool button — editorial-flat caps con accent border en active */
    function ToolBtn({ icon, children, onClick, active = false, danger = false, title, badge }) {
      return (
        <button
          onClick={onClick}
          title={title}
          className="crux-tool-btn"
          data-active={active || undefined}
          data-danger={danger || undefined}
        >
          {icon && <span style={{ display: "inline-flex", color: "currentColor", flexShrink: 0 }}>{icon}</span>}
          <span>{children}</span>
          {badge != null && badge > 0 && (
            <span style={{
              display: "inline-flex", alignItems: "center", justifyContent: "center",
              minWidth: 16, height: 16, padding: "0 5px",
              fontSize: 9, fontWeight: 700, fontFamily: mono, letterSpacing: 0,
              color: active ? C.white : C.textSec,
              background: active ? C.accent : "transparent",
              border: `1px solid ${active ? C.accent : C.borderLight}`,
              borderRadius: 2,
              marginLeft: 2,
            }}>{badge}</span>
          )}
        </button>
      );
    }

    function Header({ usuarioActual, onIrEquipo, onIrPlanificacion, onIrArchivados, onResetear, route, archivadosCount }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", close);
        return () => document.removeEventListener("mousedown", close);
      }, []);
      return (
        <header style={{ borderBottom: `1px solid ${C.border}`, padding: "18px 32px", display: "grid", gridTemplateColumns: "1fr auto 1fr", alignItems: "center", gap: 16 }}>
          <a href="/admin/hub" title="Volver al hub interno" style={{ display: "inline-flex", textDecoration: "none", outline: "none", justifySelf: "start" }}>
            <img src={CRUX_LOGO} alt="CRUX · Hub interno" style={{ width: 38, height: 38, objectFit: "contain", filter: "brightness(0) invert(1)", display: "block" }} />
          </a>

          <div style={{ display: "flex", alignItems: "center", gap: 6, justifySelf: "center" }}>
            <ToolBtn icon={HeaderIcons.Team} active={route === "equipo"} onClick={onIrEquipo}>Equipo</ToolBtn>
            <ToolBtn icon={HeaderIcons.Gantt} active={route === "planificacion"} onClick={onIrPlanificacion} title="Vista Gantt de proyectos e hitos">Planificación</ToolBtn>
            <ToolBtn icon={HeaderIcons.Archive} active={route === "archivados"} onClick={onIrArchivados} title="Clientes archivados" badge={archivadosCount}>Archivados</ToolBtn>
            <span style={{ width: 1, height: 20, background: "#1F3252", margin: "0 4px" }} />
            <ToolBtn icon={HeaderIcons.Reset} danger onClick={onResetear} title="Restaurar al estado inicial (seed)">Reset</ToolBtn>
          </div>

          <div ref={ref} style={{ position: "relative", justifySelf: "end" }}>
            <button onClick={() => setOpen(o => !o)} style={{
              display: "flex", alignItems: "center", gap: 8, background: C.surface, border: `1px solid ${C.border}`,
              borderRadius: 22, padding: "5px 14px 5px 5px", cursor: "pointer", fontFamily: font,
              fontSize: 12, color: C.textSec,
            }}>
              <Avatar nombre={usuarioActual.nombre} color={usuarioActual.color} size={26} />
              <span>{usuarioActual.nombre} · {usuarioActual.rol}</span>
              <span style={{ color: C.textDim, fontSize: 10 }}>▾</span>
            </button>
            {open && (
              <div style={{ position: "absolute", top: "calc(100% + 6px)", right: 0, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 6, minWidth: 200, zIndex: 100, boxShadow: "0 8px 24px rgba(0,0,0,0.4)" }}>
                <div style={{ fontSize: 10, color: C.textDim, padding: "6px 10px", textTransform: "uppercase", letterSpacing: 0.6 }}>Sesión</div>
                <button
                  onClick={async () => {
                    try {
                      await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
                    } catch (_) {}
                    window.location.replace('/admin');
                  }}
                  style={{
                    display: "flex", alignItems: "center", gap: 8, width: "100%",
                    background: "transparent", border: "none", padding: "8px 10px",
                    borderRadius: 6, cursor: "pointer",
                    color: C.text, fontSize: 12, fontFamily: font, textAlign: "left",
                  }}
                  onMouseEnter={(e) => { e.currentTarget.style.background = 'rgba(217,107,107,0.08)'; e.currentTarget.style.color = C.red; }}
                  onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = C.text; }}
                >
                  Cerrar sesión
                </button>
              </div>
            )}
          </div>
        </header>
      );
    }

    function Breadcrumb({ trail, onNav }) {
      return (
        <div style={{ padding: "12px 32px", borderBottom: `1px solid ${C.border}`, fontSize: 12, color: C.textDim, display: "flex", alignItems: "center", gap: 8 }}>
          {trail.map((t, i) => {
            const isLast = i === trail.length - 1;
            return (
              <React.Fragment key={i}>
                {isLast
                  ? <span style={{ color: C.white, fontWeight: 700 }}>{t.label}</span>
                  : <button onClick={() => onNav(t)} style={{ background: "none", border: "none", color: C.accent, fontWeight: 600, cursor: "pointer", fontSize: 12, fontFamily: font, padding: 0 }}>{t.label}</button>}
                {!isLast && <span style={{ color: "#3a3a3a" }}>/</span>}
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    function HomeClientes({ store, onAbrirCliente, onNuevoCliente }) {
      const clientes = store.getClientes().filter(c => !c.archivado);
      const saludColor = (s) => s === "saludable" ? C.green : s === "atencion" ? C.amber : C.red;
      const saludLabel = (s) => s === "saludable" ? "Saludable" : s === "atencion" ? "Atención" : "Riesgo";
      const archivar = (cli) => store.updateCliente(cli.id, { archivado: true, fechaArchivado: nowISO() });
      const eliminar = (cli) => askConfirm({
        title: `Eliminar cliente "${cli.nombre}"`,
        body: "Se borrarán también todos sus proyectos e iteraciones. Esta acción no se puede deshacer.",
        confirmText: "Eliminar",
        danger: true,
      }).then(ok => { if (ok) store.deleteCliente(cli.id); });
      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 24 }}>
            <div>
              <h1 style={{ fontSize: 26, fontWeight: 700, color: C.white, letterSpacing: -0.6 }}>Clientes</h1>
              <p style={{ fontSize: 12, color: C.textDim, marginTop: 4 }}>{clientes.length} cliente{clientes.length !== 1 ? "s" : ""} activo{clientes.length !== 1 ? "s" : ""}</p>
            </div>
            <button onClick={onNuevoCliente} style={{ background: C.accent, color: C.white, border: "none", borderRadius: 8, padding: "9px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: font, letterSpacing: 0.3 }}>+ Nuevo cliente</button>
          </div>

          {clientes.length === 0 ? (
            <Card>
              <div style={{ padding: "48px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 14, color: C.textSec, marginBottom: 8 }}>No hay clientes activos</div>
                <div style={{ fontSize: 12, color: C.textDim }}>Crea uno con "+ Nuevo cliente" o restaura desde archivados.</div>
              </div>
            </Card>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 16 }}>
              {clientes.map(cli => {
                const m = getMetricasCliente(store, cli.id);
                return (
                  <ClienteCard
                    key={cli.id}
                    cli={cli}
                    metricas={m}
                    onAbrir={() => onAbrirCliente(cli.id)}
                    saludColor={saludColor}
                    saludLabel={saludLabel}
                    acciones={[
                      { label: "Archivar", onClick: () => archivar(cli) },
                      { label: "Eliminar", onClick: () => eliminar(cli), danger: true },
                    ]}
                  />
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function ClienteCard({ cli, metricas, onAbrir, saludColor, saludLabel, acciones }) {
      const [hover, setHover] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const menuRef = useRef(null);
      useEffect(() => {
        if (!menuOpen) return;
        const close = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
        document.addEventListener("mousedown", close);
        return () => document.removeEventListener("mousedown", close);
      }, [menuOpen]);
      const m = metricas;
      const accionesVisibles = hover || menuOpen;
      return (
        <Card style={{ padding: 20 }} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}>
          <div onClick={onAbrir} style={{ cursor: "pointer" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14, gap: 10 }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: C.white, letterSpacing: -0.3, minWidth: 0, flex: 1, wordBreak: "break-word" }}>{cli.nombre}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 10, fontWeight: 700, color: saludColor(m.salud), whiteSpace: "nowrap" }}>
                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: saludColor(m.salud) }} /> {saludLabel(m.salud)}
                </span>
                <div ref={menuRef} style={{ position: "relative", opacity: accionesVisibles ? 1 : 0, pointerEvents: accionesVisibles ? "auto" : "none", transition: "opacity 0.15s ease" }}>
                  <button
                    onClick={(e) => { e.stopPropagation(); setMenuOpen(o => !o); }}
                    title="Acciones"
                    style={{
                      background: menuOpen ? C.surface2 : "transparent",
                      border: `1px solid ${menuOpen ? C.borderLight : C.border}`,
                      borderRadius: 6, color: C.textSec,
                      width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center",
                      cursor: "pointer", padding: 0, fontSize: 14, lineHeight: 1, fontFamily: font,
                    }}
                  >⋯</button>
                  {menuOpen && (
                    <div onClick={(e) => e.stopPropagation()} style={{ position: "absolute", top: "calc(100% + 6px)", right: 0, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 4, minWidth: 150, zIndex: 30, boxShadow: "0 8px 24px rgba(0,0,0,0.4)" }}>
                      {acciones.map((a, i) => (
                        <button
                          key={i}
                          onClick={() => { setMenuOpen(false); a.onClick(); }}
                          onMouseEnter={(e) => e.currentTarget.style.background = a.danger ? `${C.red}1a` : C.surface2}
                          onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}
                          style={{
                            display: "block", width: "100%", textAlign: "left",
                            background: "transparent", border: "none",
                            padding: "7px 10px", borderRadius: 5, fontSize: 12, fontFamily: font,
                            color: a.danger ? C.red : C.text, cursor: "pointer",
                          }}
                        >{a.label}</button>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, paddingTop: 12, borderTop: `1px solid ${C.border}` }}>
              <div><div style={{ fontFamily: mono, fontSize: 18, fontWeight: 700, color: C.white }}>{m.numProyectos}</div><div style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.6, marginTop: 2 }}>Proyectos</div></div>
              <div><div style={{ fontFamily: mono, fontSize: 18, fontWeight: 700, color: C.amber }}>{m.pendientes}</div><div style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.6, marginTop: 2 }}>Pendientes</div></div>
              <div><div style={{ fontFamily: mono, fontSize: 18, fontWeight: 700, color: C.accent }}>{m.proceso}</div><div style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.6, marginTop: 2 }}>En proceso</div></div>
            </div>
          </div>
        </Card>
      );
    }

    function NuevoClienteModal({ open, onClose, onCrear }) {
      const [nombre, setNombre] = useState("");
      const [notas, setNotas] = useState("");
      const [fechaAlta, setFechaAlta] = useState(todayISO());
      useEffect(() => { if (open) { setNombre(""); setNotas(""); setFechaAlta(todayISO()); } }, [open]);
      const submit = () => {
        if (!nombre.trim()) return;
        onCrear({ nombre: nombre.trim(), notas: notas.trim(), fechaAlta });
        onClose();
      };
      return (
        <Modal open={open} onClose={onClose} title="Nuevo cliente" footer={<><Btn onClick={onClose}>Cancelar</Btn><Btn kind="primary" onClick={submit}>Crear</Btn></>}>
          <FormField label="Nombre del cliente">
            <TextInput value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Farmacia X, Restaurante Y..." autoFocus />
          </FormField>
          <FormField label="Fecha de alta">
            <TextInput type="date" value={fechaAlta} onChange={(e) => setFechaAlta(e.target.value)} />
          </FormField>
          <FormField label="Notas (opcional)" hint="Contacto, contexto, lo que quieras recordar.">
            <TextArea value={notas} onChange={(e) => setNotas(e.target.value)} placeholder="Contacto: María García..." />
          </FormField>
        </Modal>
      );
    }

    function VistaCliente({ store, clienteId, onAbrirProyecto, onNuevoProyecto, onEditarCliente }) {
      const cli = store.getCliente(clienteId);
      if (!cli) return <Card><p style={{ color: C.red }}>Cliente no encontrado.</p></Card>;
      const proyectos = store.getProyectos(clienteId);
      const m = getMetricasCliente(store, clienteId);
      const saludColor = (s) => s === "saludable" ? C.green : s === "atencion" ? C.amber : C.red;
      const saludLabel = (s) => s === "saludable" ? "Saludable" : s === "atencion" ? "Atención" : "Riesgo";

      return (
        <div>
          {/* Banner */}
          <Card style={{ marginBottom: 18, padding: "22px 24px", background: `linear-gradient(135deg, ${C.surface} 0%, ${C.surface2} 100%)` }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 16 }}>
              <div>
                <div style={{ fontSize: 22, fontWeight: 700, color: C.white, letterSpacing: -0.4 }}>{cli.nombre}</div>
                <div style={{ fontSize: 11, color: C.textDim, marginTop: 4 }}>Alta: {cli.fechaAlta}{cli.notas ? ` · ${cli.notas}` : ""}</div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn onClick={onEditarCliente}>Editar cliente</Btn>
                <Btn kind="primary" onClick={onNuevoProyecto}>+ Nuevo proyecto</Btn>
              </div>
            </div>
          </Card>

          {/* Lista de proyectos */}
          <div style={{ marginBottom: 12, fontSize: 11, fontWeight: 700, color: C.textDim, letterSpacing: 0.7, textTransform: "uppercase" }}>Proyectos · {proyectos.length}</div>

          {proyectos.length === 0 ? (
            <Card><p style={{ color: C.textDim, fontSize: 13, textAlign: "center", padding: "20px 0" }}>Aún no hay proyectos para este cliente. Click en "+ Nuevo proyecto" para empezar.</p></Card>
          ) : (
            <div style={{ display: "grid", gap: 10 }}>
              {proyectos.map(p => {
                const its = store.getIteraciones(p.id, { incluirArchivadas: true });
                const pend = its.filter(it => it.estado === "pendiente").length;
                const proc = its.filter(it => it.estado === "en_proceso").length;
                const hechMes = its.filter(it => it.estado === "hecha" && it.fechaArchivado && new Date(it.fechaArchivado) > new Date(Date.now() - 30 * 86400000)).length;
                return (
                  <Card key={p.id} style={{ cursor: "pointer", padding: "16px 20px" }}>
                    <div onClick={() => onAbrirProyecto(p.id)} style={{ display: "grid", gridTemplateColumns: "2fr 1.2fr auto", gap: 16, alignItems: "center" }}>
                      <div>
                        <div style={{ fontSize: 15, fontWeight: 700, color: C.white }}>{p.nombre}</div>
                        <div style={{ fontSize: 11, color: C.textDim, marginTop: 3 }}>{p.url || "—"}{p.tipoPropuesta ? ` · ${p.tipoPropuesta}` : ""}{p.fechaEntrega ? ` · entrega ${p.fechaEntrega}` : ""}</div>
                      </div>
                      <div style={{ display: "flex", gap: 16, fontSize: 11, color: C.textDim }}>
                        <span><strong style={{ fontFamily: mono, color: C.amber, fontSize: 13 }}>{pend}</strong> pendientes</span>
                        <span><strong style={{ fontFamily: mono, color: C.accent, fontSize: 13 }}>{proc}</strong> en proceso</span>
                        <span><strong style={{ fontFamily: mono, color: C.green, fontSize: 13 }}>{hechMes}</strong> hechas (mes)</span>
                      </div>
                      <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 10, fontWeight: 700, color: saludColor(p.salud) }}>
                        <span style={{ width: 6, height: 6, borderRadius: "50%", background: saludColor(p.salud) }} /> {saludLabel(p.salud)}
                      </span>
                    </div>
                  </Card>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function EditarClienteModal({ open, onClose, cliente, onGuardar, onEliminar }) {
      const [nombre, setNombre] = useState("");
      const [notas, setNotas] = useState("");
      const [fechaAlta, setFechaAlta] = useState("");
      useEffect(() => { if (open && cliente) { setNombre(cliente.nombre); setNotas(cliente.notas || ""); setFechaAlta(cliente.fechaAlta); } }, [open, cliente]);
      if (!cliente) return null;
      const submit = () => { if (!nombre.trim()) return; onGuardar({ nombre: nombre.trim(), notas: notas.trim(), fechaAlta }); onClose(); };
      const eliminar = () => {
        askConfirm({
          title: `Eliminar cliente "${cliente.nombre}"`,
          body: "Se borrarán también todos sus proyectos e iteraciones. Esta acción no se puede deshacer.",
          confirmText: "Eliminar",
          danger: true,
        }).then(ok => { if (ok) { onEliminar(); onClose(); } });
      };
      return (
        <Modal open={open} onClose={onClose} title="Editar cliente" footer={<><Btn kind="danger" onClick={eliminar}>Eliminar</Btn><div style={{ flex: 1 }} /><Btn onClick={onClose}>Cancelar</Btn><Btn kind="primary" onClick={submit}>Guardar</Btn></>}>
          <FormField label="Nombre"><TextInput value={nombre} onChange={(e) => setNombre(e.target.value)} /></FormField>
          <FormField label="Fecha de alta"><TextInput type="date" value={fechaAlta} onChange={(e) => setFechaAlta(e.target.value)} /></FormField>
          <FormField label="Notas"><TextArea value={notas} onChange={(e) => setNotas(e.target.value)} /></FormField>
        </Modal>
      );
    }

    function NuevoProyectoModal({ open, onClose, equipo, onCrear }) {
      const [nombre, setNombre] = useState("");
      const [url, setUrl] = useState("");
      const [tipoPropuesta, setTipoPropuesta] = useState("");
      const [fechaEntrega, setFechaEntrega] = useState("");
      const [briefing, setBriefing] = useState("");
      const [stack, setStack] = useState({ frontend: "", backend: "", hosting: "", dominioDNS: "" });
      const [salud, setSalud] = useState("saludable");
      const [equipoIds, setEquipoIds] = useState([]);
      const [hitos, setHitos] = useState([]);

      useEffect(() => {
        if (open) {
          setNombre(""); setUrl(""); setTipoPropuesta(""); setFechaEntrega("");
          setBriefing(""); setStack({ frontend: "", backend: "", hosting: "", dominioDNS: "" });
          setSalud("saludable"); setEquipoIds([]); setHitos([]);

      }, [open]);

      const submit = () => {
        if (!nombre.trim()) return;
        const hitosLimpios = hitos
          .filter(h => h.nombre.trim() || h.fecha)
          .map(h => ({ ...h, nombre: h.nombre.trim() }));
        onCrear({ nombre: nombre.trim(), url: url.trim(), tipoPropuesta: tipoPropuesta.trim(), fechaEntrega, briefing: briefing.trim(), stack, salud, equipoIds, hitos: hitosLimpios });
        onClose();
      };

      const toggleMiembro = (id) => setEquipoIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

      const addHito = () => setHitos(prev => [...prev, { id: genId("hito"), nombre: "", fecha: fechaEntrega || todayISO(), descripcion: "", cumplido: false }]);
      const removeHito = (id) => setHitos(prev => prev.filter(h => h.id !== id));
      const updateHito = (id, patch) => setHitos(prev => prev.map(h => h.id === id ? { ...h, ...patch } : h));

      return (
        <Modal open={open} onClose={onClose} title="Nuevo proyecto" width={620} footer={<><Btn onClick={onClose}>Cancelar</Btn><Btn kind="primary" onClick={submit}>Crear proyecto</Btn></>}>
          <FormField label="Nombre del proyecto"><TextInput value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Web corporativa, App móvil..." autoFocus /></FormField>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            <FormField label="URL"><TextInput value={url} onChange={(e) => setUrl(e.target.value)} placeholder="ejemplo.com" /></FormField>
            <FormField label="Tipo propuesta"><TextInput value={tipoPropuesta} onChange={(e) => setTipoPropuesta(e.target.value)} placeholder="PROC-OPS-002" /></FormField>
            <FormField label="Fecha entrega"><TextInput type="date" value={fechaEntrega} onChange={(e) => setFechaEntrega(e.target.value)} /></FormField>
            <FormField label="Estado de salud">
              <Select value={salud} onChange={setSalud} options={[
                { value: "saludable", label: "Saludable", color: C.green },
                { value: "atencion", label: "Atención", color: C.amber },
                { value: "riesgo", label: "Riesgo", color: C.red },

            </FormField>
          </div>

          <FormField label="Stack técnico">
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              <TextInput value={stack.frontend} onChange={(e) => setStack(s => ({ ...s, frontend: e.target.value }))} placeholder="Frontend (Next.js 14)" />
              <TextInput value={stack.backend} onChange={(e) => setStack(s => ({ ...s, backend: e.target.value }))} placeholder="Backend (pan SaaS)" />
              <TextInput value={stack.hosting} onChange={(e) => setStack(s => ({ ...s, hosting: e.target.value }))} placeholder="Hosting (Vercel)" />
              <TextInput value={stack.dominioDNS} onChange={(e) => setStack(s => ({ ...s, dominioDNS: e.target.value }))} placeholder="Dominio/DNS (Namecheap)" />
            </div>
          </FormField>

          <FormField label="Briefing"><TextArea value={briefing} onChange={(e) => setBriefing(e.target.value)} placeholder="Objetivos, alcance, fuera de alcance..." /></FormField>

          <FormField label="Equipo asignado">
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {equipo.map(m => (
                <button key={m.id} onClick={() => toggleMiembro(m.id)} style={{ display: "flex", alignItems: "center", gap: 6, background: equipoIds.includes(m.id) ? C.accentGlow : C.bg, border: `1px solid ${equipoIds.includes(m.id) ? C.accent : C.border}`, borderRadius: 3, padding: "4px 10px 4px 4px", cursor: "pointer", fontFamily: font, fontSize: 11, color: equipoIds.includes(m.id) ? C.accent : C.textSec }}>
                  <Avatar nombre={m.nombre} color={m.color} size={20} />
                  {m.nombre}
                </button>
              ))}
            </div>
          </FormField>

          <FormField label="Hitos del proyecto" hint="Define los puntos clave de entrega ahora — luego podrás asociar iteraciones a cada hito.">
            {hitos.length === 0 ? (
              <div style={{
                padding: "16px 14px",
                border: `1px dashed ${C.border}`,
                borderRadius: 4,
                background: C.bg,
                fontSize: 12,
                color: C.textDim,
                fontFamily: font,
                marginBottom: 8,
                display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12,
              }}>
                <span>Sin hitos. Puedes definirlos ahora o más tarde desde la ficha.</span>
              </div>
            ) : (
              <div style={{ border: `1px solid ${C.border}`, borderRadius: 4, overflow: "hidden", marginBottom: 8 }}>
                <div style={{ display: "grid", gridTemplateColumns: "auto 1fr 130px auto", gap: 0, alignItems: "center", background: C.bg, padding: "6px 12px", borderBottom: `1px solid ${C.border}`, fontSize: 9, fontFamily: mono, letterSpacing: 0.6, textTransform: "uppercase", color: C.textDim }}>
                  <span style={{ width: 8, marginRight: 8 }}>·</span>
                  <span>Nombre</span>
                  <span>Fecha</span>
                  <span style={{ width: 28 }}></span>
                </div>
                {hitos.slice().sort((a, b) => (a.fecha || "").localeCompare(b.fecha || "")).map((h, idx) => {
                  const u = hitoUrgencia(h);
                  const col = hitoColor(u);

                    <div key={h.id} style={{ display: "grid", gridTemplateColumns: "auto 1fr 130px auto", gap: 0, alignItems: "center", background: C.surface, padding: "8px 12px", borderBottom: idx < hitos.length - 1 ? `1px solid ${C.border}` : "none" }}>
                      <span title={u} style={{ width: 8, height: 8, borderRadius: "50%", background: col.fg, marginRight: 8, flexShrink: 0 }} />
                      <input
                        value={h.nombre}
                        onChange={(e) => updateHito(h.id, { nombre: e.target.value })}
                        placeholder="Lanzamiento, QA, validación cliente…"
                        style={{ background: "transparent", border: "none", color: C.text, fontFamily: font, fontSize: 13, outline: "none", padding: "4px 0", width: "100%" }}
                      />
                      <input
                        type="date"
                        value={h.fecha || ""}
                        onChange={(e) => updateHito(h.id, { fecha: e.target.value })}
                        style={{ background: "transparent", border: "none", color: C.textSec, fontFamily: mono, fontSize: 11, outline: "none", padding: "4px 0", width: "100%" }}
                      />
                      <button
                        onClick={() => removeHito(h.id)}
                        title="Eliminar hito"
                        style={{ background: "transparent", border: "none", color: C.textDim, cursor: "pointer", padding: "4px 6px", borderRadius: 3, fontSize: 14, lineHeight: 1 }}
                        onMouseEnter={(e) => { e.currentTarget.style.color = C.red; }}
                        onMouseLeave={(e) => { e.currentTarget.style.color = C.textDim; }}
                      >×</button>
                    </div>
                  );
                })}
              </div>
            )}
            <Btn onClick={addHito}>+ Añadir hito</Btn>
          </FormField>
        </Modal>
      );
    }

    function SidePanel({ store, proyecto, onVerFichaCompleta, onVerHitos }) {
      const team = useTeam();
      const equipo = teamToMembers(team);
      const miembros = proyecto.equipoIds.map(id => equipo.find(m => m.id === id)).filter(Boolean);

      const dias = proxHito ? diasHasta(proxHito.fecha) : null;

      const saludColor = proyecto.salud === "saludable" ? C.green : proyecto.salud === "atencion" ? C.amber : C.red;
      const saludLabel = proyecto.salud === "saludable" ? "Saludable" : proyecto.salud === "atencion" ? "Atención" : "Riesgo";

      const Block = ({ label, children }) => (
        <div style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 9, fontWeight: 700, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.7, marginBottom: 10 }}>{label}</div>
          {children}

      const Row = ({ k, v, link, onCopy }) => (
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "5px 0", color: C.textSec }}>
          <span>{k}</span>
          <span style={{ color: link ? C.accent : C.text, fontWeight: 600, fontFamily: mono, fontSize: 11, cursor: onCopy ? "pointer" : "default" }} onClick={onCopy} title={onCopy ? "Click para copiar" : ""}>{v || "—"}</span>

      return (
        <div style={{ padding: "0 4px" }}>
          <Block label="Estado">
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, color: saludColor, fontSize: 11, fontWeight: 700 }}>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: saludColor }} /> {saludLabel}

            <Row k="Entrega" v={proyecto.fechaEntrega} />

          <Block label="Equipo">
            <div style={{ display: "flex", gap: 5 }}>
              {miembros.length === 0 ? <span style={{ fontSize: 12, color: C.textDim }}>Sin equipo asignado</span> :
                miembros.map(m => <Avatar key={m.id} nombre={m.nombre} color={m.color} size={26} title={`${m.nombre} · ${m.rol}`} />)}
            </div>
          </Block>

          <Block label="Ficha rápida">
            <Row k="URL" v={proyecto.url} link onCopy={() => proyecto.url && copy(proyecto.url)} />
            <Row k="Stack" v={proyecto.stack.frontend && proyecto.stack.backend ? `${proyecto.stack.frontend} + ${proyecto.stack.backend}` : (proyecto.stack.frontend || proyecto.stack.backend || "—")} />
            <Row k="Hosting" v={proyecto.stack.hosting} />
            <Row k="DNS" v={proyecto.stack.dominioDNS} />

          <Block label="Próximo hito">
            {proxHito
              ? <Row k={proxHito.nombre} v={dias != null ? (dias === 0 ? "hoy" : dias < 0 ? `hace ${-dias} d` : `en ${dias} d`) : proxHito.fecha} />
              : <div style={{ fontSize: 12, color: C.textDim }}>Sin hitos definidos</div>}
            {proxHito && dias != null && <div style={{ fontSize: 10, color: colorDias, marginTop: 4 }}>{proxHito.fecha}</div>}
            {proyecto.hitos.length > 0 && (
              <button onClick={onVerHitos} className="crux-link-btn crux-link-btn-sm" style={{ marginTop: 12 }}>
                <span>Ver timeline de hitos</span>
                <span className="crux-link-arrow">
                  <span className="crux-link-rule" />

          <button onClick={onVerFichaCompleta} className="crux-link-btn" style={{ marginTop: 6 }}>
            <span>Ver ficha completa</span>

              <span className="crux-link-rule" />
              <span className="crux-link-tip">→</span>
            </span>
          </button>
        </div>
      );
