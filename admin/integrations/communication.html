    function ListaIteraciones({ store, proyectoId, initialOpts, usuarioActual }) {
      const [filtroEstado, setFiltroEstado] = useState("activas"); // activas | hechas | descartadas | todas
      const [filtroTipos, setFiltroTipos] = useState([]); // [] = todos
      const [query, setQuery] = useState("");
      const [expandidoId, setExpandidoId] = useState(null);
      const [editandoId, setEditandoId] = useState(null);
      const [filtroHitoId, setFiltroHitoId] = useState(null); // null = sin filtro · "__sin__" = solo sin hito · id = ese hito
      const viewModeKey = `crux.comunicacion.v1.proyecto.${proyectoId}.iteracionesView`;
      const [viewMode, setViewMode] = useState(() => {
        try { return localStorage.getItem(viewModeKey) || "lista"; } catch { return "lista"; }
      });
      useEffect(() => {
        try { localStorage.setItem(viewModeKey, viewMode); } catch {}
      }, [viewMode, viewModeKey]);

      useEffect(() => {
        if (!initialOpts) return;
        if (initialOpts.viewMode) setViewMode(initialOpts.viewMode);
        if (initialOpts.filtroHitoId !== undefined) setFiltroHitoId(initialOpts.filtroHitoId || null);
      }, [initialOpts]);

      const [hitoColapsados, setHitoColapsados] = useState({}); // { [hitoId|"__sin__"]: true } = colapsado
      const toggleHitoColapso = (key) => setHitoColapsados(prev => ({ ...prev, [key]: !prev[key] }));

      const [vistaOpen, setVistaOpen] = useState(false);
      const vistaRef = useRef(null);
      useEffect(() => {
        const close = (e) => { if (vistaRef.current && !vistaRef.current.contains(e.target)) setVistaOpen(false); };
        document.addEventListener("mousedown", close);
        return () => document.removeEventListener("mousedown", close);
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
            e.preventDefault();
            document.getElementById("iter-search")?.focus();
          }
        };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, []);

      const team = useTeam();
      const equipo = teamToMembers(team);
      const all = store.getIteraciones(proyectoId, { incluirArchivadas: true });
      const proyecto = store.getProyecto(proyectoId);
      const hitosProyecto = (proyecto?.hitos || []).slice().sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));

      const visibles = all.filter(it => {
        if (filtroEstado === "activas" && (it.estado === "hecha" || it.estado === "descartada")) return false;
        if (filtroEstado === "hechas" && it.estado !== "hecha") return false;
        if (filtroEstado === "descartadas" && it.estado !== "descartada") return false;
        if (filtroTipos.length > 0 && !filtroTipos.includes(it.tipo)) return false;
        if (query.trim() && !it.descripcion.toLowerCase().includes(query.toLowerCase())) return false;
        if (filtroHitoId === "__sin__" && it.hitoId) return false;
        if (filtroHitoId && filtroHitoId !== "__sin__" && it.hitoId !== filtroHitoId) return false;
        return true;
      });

      const counts = {
        activas: all.filter(it => it.estado === "pendiente" || it.estado === "en_proceso").length,
        hechas: all.filter(it => it.estado === "hecha").length,
        descartadas: all.filter(it => it.estado === "descartada").length,
        todas: all.length,
      };

      const toggleTipo = (id) => setFiltroTipos(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

      const Pill = ({ active, onClick, children, color }) => (
        <button onClick={onClick} style={{
          fontSize: 11, padding: "4px 10px", borderRadius: 12,
          background: active ? `${color || C.accent}26` : C.surface,
          color: active ? (color || C.accent) : C.textSec,
          border: `1px solid ${active ? (color || C.accent) : C.border}`,
          fontWeight: 600, cursor: "pointer", fontFamily: font, letterSpacing: 0.2,
        }}>{children}</button>
      );

      return (
        <div>
          {/* Quick add */}
          <QuickAdd store={store} proyectoId={proyectoId} usuarioActual={usuarioActual} />

          {/* Toolbar única: buscador + Estado select + Tipo multiselect + Toggle (si hay hitos) */}
          <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 18, flexWrap: "wrap" }}>
            <input id="iter-search" type="text" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar en iteraciones... (atajo: /)" style={{
              flex: 1, minWidth: 180, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8,
              padding: "8px 12px", color: C.text, fontFamily: font, fontSize: 13, outline: "none",
            }} onFocus={(e) => e.target.style.borderColor = C.accent} onBlur={(e) => e.target.style.borderColor = C.border} />
            <Select
              value={filtroEstado}
              onChange={setFiltroEstado}
              options={[
                { value: "activas", label: `Activas (${counts.activas})` },
                { value: "hechas", label: `Hechas (${counts.hechas})`, color: C.green },
                { value: "descartadas", label: `Descartadas (${counts.descartadas})`, color: C.textDim },
                { value: "todas", label: `Todas (${counts.todas})` },
              ]}
              buttonStyle={{ padding: "8px 10px", fontSize: 12, minWidth: 130 }}
            />
            <MultiSelect
              values={filtroTipos}
              onChange={setFiltroTipos}
              options={TIPOS.map(t => ({ value: t.id, label: t.label, color: t.color }))}
              label="Tipo"
              buttonStyle={{ padding: "8px 10px", fontSize: 12, minWidth: 90 }}
            />
            {(() => {
              const opts = [
                { value: "lista", label: "Lista", desc: "Lineal, por fecha de creación" },
                ...(hitosProyecto.length > 0 ? [{ value: "porHito", label: "Por hitos", desc: "Agrupado por hito del proyecto" }] : []),
                { value: "porPersona", label: "Por persona", desc: "Agrupado por responsable de la iteración" },
              ];
              const current = opts.find(o => o.value === viewMode) || opts[0];
              return (
                <div ref={vistaRef} style={{ position: "relative", marginLeft: "auto", flexShrink: 0 }}>
                  <button type="button" className="crux-ctrl-btn" data-open={vistaOpen || undefined}
                    onClick={() => setVistaOpen(o => !o)}
                    style={{ minWidth: 200, gap: 10, padding: "9px 14px" }}>
                    <span style={{ fontSize: 9, fontFamily: mono, color: C.textDim, letterSpacing: 0.7, textTransform: "uppercase" }}>Vista</span>
                    <span style={{ width: 1, height: 12, background: C.border }} />
                    <span style={{ flex: 1, textAlign: "left", color: C.text }}>{current.label}</span>
                    <span style={{ color: C.textDim, fontSize: 9 }}>▾</span>
                  </button>
                  {vistaOpen && (
                    <div style={{ position: "absolute", top: "calc(100% + 4px)", right: 0, minWidth: 280, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 4, padding: 4, zIndex: 200, boxShadow: "0 12px 30px rgba(0,0,0,0.55)" }}>
                      {opts.map(o => {
                        const active = o.value === viewMode;
                        return (
                          <button key={o.value} type="button"
                            onClick={() => { setViewMode(o.value); setVistaOpen(false); }}
                            style={{
                              display: "block", width: "100%", textAlign: "left",
                              background: active ? C.accentGlow : "transparent",
                              border: "none", padding: "10px 12px", borderRadius: 3,
                              cursor: "pointer", fontFamily: font,
                              borderLeft: `2px solid ${active ? C.accent : "transparent"}`,
                            }}
                            onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = C.surface2; }}
                            onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                            <div style={{ fontSize: 12, fontWeight: 600, color: active ? C.accent : C.text, letterSpacing: 0.1 }}>{o.label}</div>
                            <div style={{ fontSize: 10, color: C.textDim, marginTop: 2, fontFamily: font }}>{o.desc}</div>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })()}
          </div>

          {/* Chip de filtro hito persistente */}
          {filtroHitoId && (
            <div style={{ marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 10, color: C.textDim, fontFamily: mono, letterSpacing: 0.5, textTransform: "uppercase" }}>Filtrar por hito:</span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: C.accentGlow, border: `1px solid ${C.accent}`, color: C.accent, borderRadius: 12, padding: "3px 4px 3px 10px", fontSize: 11, fontWeight: 600, fontFamily: font }}>
                {filtroHitoId === "__sin__" ? "Sin hito" : (store.getHito(proyectoId, filtroHitoId)?.nombre || "(borrado)")}
                <button onClick={() => setFiltroHitoId(null)} style={{ background: "none", border: "none", color: C.accent, cursor: "pointer", fontSize: 13, lineHeight: 1, padding: "0 4px" }} title="Quitar filtro">×</button>
              </span>
            </div>
          )}

          {/* Lista o agrupado por hito */}
          {(() => {
            if (visibles.length === 0) {
              return <Card><p style={{ color: C.textDim, fontSize: 13, textAlign: "center", padding: "20px 0" }}>{all.length === 0 ? "Aún no hay iteraciones." : "Ningún resultado con los filtros actuales."}</p></Card>;
            }

            const renderTarjeta = (it) => {
              const autor = equipo.find(m => m.id === it.autorId);
              const tipo = tipoOf(it.tipo);
              const est = estadoOf(it.estado);
              const archivada = it.estado === "hecha" || it.estado === "descartada";
              const expandida = expandidoId === it.id;
              return (
                <div key={it.id} style={{ borderBottom: `1px solid ${C.border}` }}>
                  <div style={{ padding: "12px 4px", display: "grid", gridTemplateColumns: "auto 1fr auto auto", gap: 12, alignItems: "flex-start", opacity: archivada ? 0.55 : 1 }}>
                    <button onClick={() => {
                      const cycle = { pendiente: "en_proceso", en_proceso: "hecha", hecha: "pendiente", descartada: "pendiente" };
                      store.updateIteracion(it.id, { estado: cycle[it.estado], asignadoId: cycle[it.estado] === "en_proceso" ? usuarioActual.id : null });
                    }} title="Click cicla: pendiente → en proceso → hecha → pendiente" style={{
                      width: 16, height: 16, borderRadius: 3, border: `1.5px solid ${est.color}`,
                      background: it.estado === "hecha" ? est.color : it.estado === "en_proceso" ? `${est.color}33` : "transparent",
                      display: "flex", alignItems: "center", justifyContent: "center",
                      color: it.estado === "hecha" ? C.bg : est.color, fontSize: 10, fontWeight: 800,
                      cursor: "pointer", marginTop: 4, padding: 0, flexShrink: 0,
                    }}>{it.estado === "hecha" ? "✓" : it.estado === "en_proceso" ? "▸" : it.estado === "descartada" ? "×" : ""}</button>

                    <div onClick={() => setExpandidoId(expandida ? null : it.id)} style={{ cursor: "pointer" }}>
                      <div style={{ fontSize: 13, color: C.text, lineHeight: 1.5 }}>{it.descripcion}</div>
                      <div style={{ fontSize: 10, color: C.textDim, marginTop: 4, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                        {autor && <><Avatar nombre={autor.nombre} color={autor.color} size={14} /> {autor.nombre}</>}
                        <span style={{ color: tipo.color }}>· {tipo.label}</span>
                        {it.estado === "en_proceso" && it.asignadoId && <span style={{ color: C.accent }}>· en proceso por {equipo.find(m => m.id === it.asignadoId)?.nombre || "?"}</span>}
                        {it.comentarios.length > 0 && <span>· 💬 {it.comentarios.length}</span>}
                        {viewMode !== "porHito" && (
                          <span style={{ marginLeft: 2 }}>
                            <HitoChip
                              hito={it.hitoId ? store.getHito(it.proyectoId, it.hitoId) : null}
                              onClick={() => setFiltroHitoId(it.hitoId || "__sin__")}
                              compact
                            />
                          </span>
                        )}
                      </div>
                    </div>

                    <div style={{ fontSize: 10, color: C.textDim, fontFamily: mono, whiteSpace: "nowrap", marginTop: 2 }}>{formatRelDate(it.fechaCreacion)}</div>

                    <MenuAcciones it={it} store={store} onEditar={() => setEditandoId(it.id)} />
                  </div>

                  {expandida && (
                    <PanelExpandido it={it} store={store} equipo={equipo} usuarioId={usuarioActual.id} onCerrar={() => setExpandidoId(null)} />
                  )}
                </div>
              );
            };

            const PStat = ({ label, value, color }) => (
              <span style={{ display: "inline-flex", alignItems: "baseline", gap: 5, padding: "4px 9px", border: `1px solid ${C.border}`, borderRadius: 3, fontFamily: mono, background: C.bg }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: color || C.text, letterSpacing: -0.3, lineHeight: 1 }}>{value}</span>
                <span style={{ fontSize: 8.5, color: C.textDim, letterSpacing: 0.6, textTransform: "uppercase", lineHeight: 1 }}>{label}</span>
              </span>
            );

            if (viewMode === "porPersona") {
              const personaIdDe = (it) => it.asignadoId || it.autorId || null;
              const ids = Array.from(new Set(visibles.map(personaIdDe)));
              const grupos = ids.map(uid => ({
                key: uid || "__sin__",
                persona: uid ? equipo.find(m => m.id === uid) : null,
                its: visibles.filter(it => personaIdDe(it) === uid),
              }))
                .filter(g => g.its.length > 0)
                .sort((a, b) => {
                  if (!a.persona !== !b.persona) return !a.persona ? 1 : -1;
                  const aPend = a.its.filter(it => it.estado === "pendiente" || it.estado === "en_proceso").length;
                  const bPend = b.its.filter(it => it.estado === "pendiente" || it.estado === "en_proceso").length;
                  if (aPend !== bPend) return bPend - aPend;
                  return (a.persona?.nombre || "zz").localeCompare(b.persona?.nombre || "zz");
                });

              return (
                <div>
                  {grupos.map(g => {
                    const total = g.its.length;
                    const pend = g.its.filter(it => it.estado === "pendiente").length;
                    const proc = g.its.filter(it => it.estado === "en_proceso").length;
                    const hechas = g.its.filter(it => it.estado === "hecha").length;
                    const persona = g.persona;
                    return (
                      <div key={g.key} style={{ marginBottom: 18, border: `1px solid ${C.border}`, borderRadius: 6, overflow: "hidden" }}>
                        <div style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 14, alignItems: "center", background: C.surface, padding: "12px 16px", borderBottom: `1px solid ${C.border}` }}>
                          {persona ? (
                            <Avatar nombre={persona.nombre} color={persona.color} size={34} />
                          ) : (
                            <div style={{ width: 34, height: 34, borderRadius: "50%", background: C.bg, border: `1px dashed ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, color: C.textDim, fontFamily: mono }}>?</div>
                          )}
                          <div style={{ minWidth: 0, display: "flex", flexDirection: "column", gap: 2 }}>
                            <div style={{ fontSize: 13, fontWeight: 700, color: C.white, letterSpacing: -0.2 }}>{persona ? persona.nombre : "Sin asignar"}</div>
                            <div style={{ fontSize: 9, color: C.textDim, fontFamily: mono, letterSpacing: 0.6, textTransform: "uppercase" }}>
                              {persona?.rol || "—"}
                            </div>
                          </div>
                          <div style={{ display: "flex", gap: 6 }}>
                            <PStat label="Total" value={total} />
                            {pend > 0 && <PStat label="Pend" value={pend} color={C.amber} />}
                            {proc > 0 && <PStat label="En curso" value={proc} color={C.accent} />}
                            {hechas > 0 && <PStat label="Hechas" value={hechas} color={C.green} />}
                          </div>
                        </div>
                        <div style={{ background: C.bg }}>
                          {g.its.map(renderTarjeta)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            }

            if (viewMode === "lista" || hitosProyecto.length === 0) {
              return <div>{visibles.map(renderTarjeta)}</div>;
            }

            // Modo "Por hito": agrupar visibles por hitoId, secciones colapsables
            const grupos = hitosProyecto.map(h => ({
              key: h.id,
              hito: h,
              its: visibles.filter(it => it.hitoId === h.id),
            }));
            const sinHito = { key: "__sin__", hito: null, its: visibles.filter(it => !it.hitoId) };
            const todos = [...grupos, sinHito].filter(g => g.its.length > 0);

            if (todos.length === 0) {
              return <Card><p style={{ color: C.textDim, fontSize: 13, textAlign: "center", padding: "20px 0" }}>Ningún resultado con los filtros actuales.</p></Card>;
            }

            return (
              <div>
                {todos.map(g => {
                  const colapsado = !!hitoColapsados[g.key];
                  const u = g.hito ? hitoUrgencia(g.hito) : "ninguno";
                  const col = hitoColor(u);
                  const pendientes = g.its.filter(it => it.estado === "pendiente").length;
                  return (
                    <div key={g.key} style={{ marginBottom: 18, border: `1px solid ${C.border}`, borderRadius: 8, overflow: "hidden" }}>
                      <button onClick={() => toggleHitoColapso(g.key)} style={{
                        width: "100%", display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 12, alignItems: "center",
                        background: C.surface, border: "none", padding: "10px 14px", cursor: "pointer", fontFamily: font, textAlign: "left",
                        borderBottom: colapsado ? "none" : `1px solid ${C.border}`,
                      }}>
                        <span style={{ color: C.textDim, fontSize: 10, fontFamily: mono, width: 12 }}>{colapsado ? "▸" : "▾"}</span>
                        <span style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                          <span style={{ width: 8, height: 8, borderRadius: "50%", background: col.fg, flexShrink: 0 }} />
                          <span style={{ fontSize: 13, fontWeight: 700, color: C.white, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                            {g.hito ? (g.hito.nombre || "(sin nombre)") : "Sin hito"}
                          </span>
                          {g.hito?.fecha && <span style={{ fontSize: 10, color: C.textDim, fontFamily: mono, letterSpacing: 0.3 }}>· {g.hito.fecha}</span>}
                        </span>
                        <span style={{ fontSize: 10, color: C.textDim, fontFamily: mono, letterSpacing: 0.4, textTransform: "uppercase", whiteSpace: "nowrap" }}>
                          {g.its.length} {g.its.length === 1 ? "iteración" : "iteraciones"}{pendientes > 0 && ` · ${pendientes} pend`}
                        </span>
                      </button>
                      {!colapsado && (
                        <div style={{ background: C.bg }}>
                          {g.its.map(renderTarjeta)}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })()}
          <EditarIteracionModal
            open={!!editandoId}
            onClose={() => setEditandoId(null)}
            iteracion={editandoId ? store.getIteracion(editandoId) : null}
            equipo={equipo}
            store={store}
            onGuardar={(d) => store.updateIteracion(editandoId, d)}
          />
        </div>
      );
    }

    function QuickAdd({ store, proyectoId, usuarioActual }) {
      const [texto, setTexto] = useState("");
      const [tipo, setTipo] = useState("diseño");
      const [hitoId, setHitoId] = useState("");
      const inputRef = useRef(null);
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "n" && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
            e.preventDefault();
            inputRef.current?.focus();
          }
        };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, []);
      const proyecto = store.getProyecto(proyectoId);
      const hitos = (proyecto?.hitos || []).slice().sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
      const submit = () => {
        if (!texto.trim()) return;
        store.addIteracion(proyectoId, { descripcion: texto.trim(), autorId: usuarioActual.id, tipo, hitoId: hitoId || null });
        setTexto("");
        inputRef.current?.focus();
      };
      const hitoOptions = [
        { value: "", label: "— Sin hito —" },
        ...hitos.map(h => {
          const u = hitoUrgencia(h);
          return { value: h.id, label: h.nombre || "(sin nombre)", color: hitoColor(u).fg };
        }),
      ];
      return (
        <div style={{ display: "flex", gap: 8, marginBottom: 14, padding: "10px 12px", background: C.surface, border: `1px dashed ${C.border}`, borderRadius: 8 }}>
          <span style={{ color: C.accent, fontSize: 16, fontWeight: 700, lineHeight: "30px" }}>+</span>
          <input ref={inputRef} value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Añadir iteración rápida... (atajo: n)" style={{
            flex: 1, background: "transparent", border: "none", color: C.text, fontFamily: font, fontSize: 13, outline: "none", padding: "6px 0",
          }} />
          <Select value={tipo} onChange={setTipo} options={TIPOS.map(t => ({ value: t.id, label: t.label, color: t.color }))} style={{ minWidth: 130 }} />
          {hitos.length > 0 && (
            <Select value={hitoId} onChange={setHitoId} options={hitoOptions} style={{ minWidth: 150 }} />
          )}
          <button onClick={submit} className="crux-btn crux-btn-primary">Añadir</button>
        </div>
      );
    }

    function MenuAcciones({ it, store, onEditar }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", close);
        return () => document.removeEventListener("mousedown", close);
      }, []);

      const eliminar = () => {
        askConfirm({
          title: "Eliminar iteración",
          body: "Se borrará definitivamente. Esta acción no se puede deshacer.",
          confirmText: "Eliminar",
          danger: true,
        }).then(ok => { if (ok) store.deleteIteracion(it.id); });
      };

      const items = [
        { label: "Editar", action: onEditar },
        { label: "Marcar pendiente", action: () => store.updateIteracion(it.id, { estado: "pendiente", asignadoId: null }), disabled: it.estado === "pendiente" },
        { label: "Marcar hecha", action: () => store.updateIteracion(it.id, { estado: "hecha" }), disabled: it.estado === "hecha" },
        { label: "Descartar", action: () => store.updateIteracion(it.id, { estado: "descartada" }), disabled: it.estado === "descartada" },
        { label: "Eliminar definitivamente", action: eliminar, danger: true },
      ];

      return (
        <div ref={ref} style={{ position: "relative" }}>
          <button onClick={() => setOpen(o => !o)} style={{ background: "none", border: "none", color: C.textDim, cursor: "pointer", padding: "2px 6px", fontSize: 14, lineHeight: 1, borderRadius: 4 }} title="Acciones">⋯</button>
          {open && (
            <div style={{ position: "absolute", top: "calc(100% + 4px)", right: 0, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 4, minWidth: 200, zIndex: 50, boxShadow: "0 6px 18px rgba(0,0,0,0.3)" }}>
              {items.map((i, idx) => (
                <button key={idx} disabled={i.disabled} onClick={() => { i.action(); setOpen(false); }} style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
                  width: "100%", textAlign: "left", background: "transparent", border: "none",
                  padding: "7px 10px", borderRadius: 5, fontSize: 12, fontFamily: font,
                  color: i.disabled ? C.textSec : i.danger ? C.red : C.text,
                  cursor: i.disabled ? "default" : "pointer",
                }} onMouseEnter={(e) => !i.disabled && (e.currentTarget.style.background = i.danger ? `${C.red}1a` : C.surface2)} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                  <span>{i.label}</span>
                  {i.disabled && <span style={{ fontSize: 10, color: C.textDim, fontStyle: "italic" }}>actual</span>}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    function PanelExpandido({ it, store, equipo, usuarioId, onCerrar }) {
      const [comentario, setComentario] = useState("");
      const enviar = () => {
        if (!comentario.trim()) return;
        store.addComentario(it.id, { autorId: usuarioId, texto: comentario.trim() });
        setComentario("");
      };
      const borrarComent = (cId) => {
        askConfirm({
          title: "Borrar comentario",
          body: "Esta acción no se puede deshacer.",
          confirmText: "Borrar",
          danger: true,
        }).then(ok => { if (ok) store.deleteComentario(it.id, cId); });
      };
      const autorOf = (id) => equipo.find(m => m.id === id);

      return (
        <div style={{ padding: "0 4px 16px 32px", background: C.surface }}>
          <div style={{ background: C.bg, borderRadius: 8, padding: 14, border: `1px solid ${C.border}` }}>
            <div style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.6, marginBottom: 8 }}>Descripción completa</div>
            <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6, whiteSpace: "pre-wrap", marginBottom: 14 }}>{it.descripcion}</div>
            {it.enlace && <div style={{ marginBottom: 12 }}><a href={it.enlace} target="_blank" rel="noreferrer" style={{ color: C.accent, fontSize: 12 }}>↗ {it.enlace}</a></div>}

            <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 12 }}>
              <div style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.6, marginBottom: 8 }}>Comentarios ({it.comentarios.length})</div>
              {it.comentarios.length === 0 && <div style={{ fontSize: 12, color: C.textDim, fontStyle: "italic", marginBottom: 12 }}>Aún no hay comentarios.</div>}
              {it.comentarios.map(c => {
                const a = autorOf(c.autorId);
                return (
                  <div key={c.id} style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 10, marginBottom: 10, alignItems: "flex-start" }}>

                    <div>
                      <div style={{ fontSize: 11, color: C.white, fontWeight: 700 }}>{a?.nombre || "?"} <span style={{ color: C.textDim, fontWeight: 400, marginLeft: 4 }}>{formatRelDate(c.fecha)}</span></div>
                      <div style={{ fontSize: 12, color: C.textSec, lineHeight: 1.5, marginTop: 2, whiteSpace: "pre-wrap" }}>{c.texto}</div>
                    </div>
                    <button onClick={() => borrarComent(c.id)} style={{ background: "none", border: "none", color: C.textDim, fontSize: 12, cursor: "pointer", padding: "2px 6px" }} title="Borrar comentario">×</button>
                  </div>
                );
              })}

              <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "flex-start" }}>
                <textarea value={comentario} onChange={(e) => setComentario(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) enviar(); }} placeholder="Añade un comentario... (Ctrl+Enter)" style={{ flex: 1, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 10px", color: C.text, fontFamily: font, fontSize: 12, resize: "vertical", minHeight: 50, outline: "none" }} onFocus={(e) => e.target.style.borderColor = C.accent} onBlur={(e) => e.target.style.borderColor = C.border} />
                <button onClick={enviar} className="crux-btn crux-btn-primary" style={{ alignSelf: "flex-start" }}>Enviar</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function NuevoHitoMiniModal({ open, onClose, onCrear }) {
      const [nombre, setNombre] = useState("");
      const [fecha, setFecha] = useState(todayISO());
      useEffect(() => { if (open) { setNombre(""); setFecha(todayISO()); } }, [open]);
      const submit = () => {
        if (!nombre.trim()) return;
        onCrear({ nombre: nombre.trim(), fecha });
        onClose();
      };
      return (
        <Modal open={open} onClose={onClose} title="Nuevo hito" width={380} footer={<><Btn onClick={onClose}>Cancelar</Btn><Btn kind="primary" onClick={submit}>Crear hito</Btn></>}>
          <FormField label="Nombre del hito"><TextInput value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Lanzamiento, QA, validación cliente..." autoFocus /></FormField>
          <FormField label="Fecha"><TextInput type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} /></FormField>
        </Modal>
      );
    }

    function EditarIteracionModal({ open, onClose, iteracion, equipo, store, onGuardar }) {
      const [descripcion, setDescripcion] = useState("");
      const [tipo, setTipo] = useState("otro");
      const [autorId, setAutorId] = useState(null);
      const [enlace, setEnlace] = useState("");
      const [hitoId, setHitoId] = useState("");
      const [nuevoHitoOpen, setNuevoHitoOpen] = useState(false);
      useEffect(() => {
        if (open && iteracion) {
          setDescripcion(iteracion.descripcion);
          setTipo(iteracion.tipo);
          setAutorId(iteracion.autorId);
          setEnlace(iteracion.enlace || "");
          setHitoId(iteracion.hitoId || "");
          setNuevoHitoOpen(false);
        }
      }, [open, iteracion]);
      if (!iteracion) return null;
      const proyecto = store.getProyecto(iteracion.proyectoId);
      const hitos = (proyecto?.hitos || []).slice().sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
      const hitoOptions = [
        { value: "", label: "— Sin hito —" },
        ...hitos.map(h => {
          const u = hitoUrgencia(h);
          return { value: h.id, label: `${h.nombre || "(sin nombre)"}${h.fecha ? ` · ${h.fecha}` : ""}`, color: hitoColor(u).fg };
        }),
        { value: "__nuevo__", label: "+ Crear nuevo hito…", color: C.accent },
      ];
      const onChangeHito = (v) => {
        if (v === "__nuevo__") { setNuevoHitoOpen(true); return; }
        setHitoId(v);
      };
      const handleNuevoHito = (data) => {
        const creado = store.addHitoEnProyecto(iteracion.proyectoId, data);
        setHitoId(creado.id);
      };
      const submit = () => {
        if (!descripcion.trim()) return;
        onGuardar({ descripcion: descripcion.trim(), tipo, autorId, enlace: enlace.trim(), hitoId: hitoId || null });
        onClose();
      };
      return (
        <>
          <Modal open={open} onClose={onClose} title="Editar iteración" footer={<><Btn onClick={onClose}>Cancelar</Btn><Btn kind="primary" onClick={submit}>Guardar</Btn></>}>
            <FormField label="Descripción"><TextArea value={descripcion} onChange={(e) => setDescripcion(e.target.value)} style={{ minHeight: 100 }} autoFocus /></FormField>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <FormField label="Tipo">
                <Select value={tipo} onChange={setTipo} options={TIPOS.map(t => ({ value: t.id, label: t.label, color: t.color }))} buttonStyle={{ padding: "8px 10px", fontSize: 13 }} />
              </FormField>
              <FormField label="Autor">
                <Select value={autorId || ""} onChange={(v) => setAutorId(v || null)} options={[{ value: "", label: "— Sin asignar —" }, ...equipo.map(m => ({ value: m.id, label: m.nombre, color: m.color }))]} buttonStyle={{ padding: "8px 10px", fontSize: 13 }} />
              </FormField>
            </div>
            <FormField label="Hito (opcional)" hint="Asocia esta iteración al hito al que contribuye.">
              <Select value={hitoId} onChange={onChangeHito} options={hitoOptions} buttonStyle={{ padding: "8px 10px", fontSize: 13 }} />
            </FormField>
            <FormField label="Enlace (opcional)" hint="URL a la página/sección donde está el cambio."><TextInput value={enlace} onChange={(e) => setEnlace(e.target.value)} placeholder="https://..." /></FormField>
          </Modal>
          <NuevoHitoMiniModal open={nuevoHitoOpen} onClose={() => setNuevoHitoOpen(false)} onCrear={handleNuevoHito} />
        </>
      );
    }

    function FichaCompletaModal({ open, onClose, proyecto, equipo, onGuardar, onEliminar }) {
      const [draft, setDraft] = useState(null);
      useEffect(() => { if (open && proyecto) setDraft(JSON.parse(JSON.stringify(proyecto))); }, [open, proyecto]);
      if (!draft) return null;

      const setField = (path, value) => {
        setDraft(prev => {
          const copy = JSON.parse(JSON.stringify(prev));
          const parts = path.split(".");
          let obj = copy;
          for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
          obj[parts[parts.length - 1]] = value;
          return copy;
        });
      };
      const addHito = () => setDraft(prev => ({ ...prev, hitos: [...prev.hitos, { id: genId("hito"), nombre: "", fecha: todayISO(), descripcion: "", cumplido: false }] }));
      const removeHito = (id) => setDraft(prev => ({ ...prev, hitos: prev.hitos.filter(h => h.id !== id) }));

    function VistaHitos({ store, proyectoId, onVolver, onVerIteracionesDeHito }) {

      const setHitos = (newHitos) => store.updateProyecto(proyectoId, { hitos: newHitos });
      const updateHito = (id, patch) => setHitos(proyecto.hitos.map(h => h.id === id ? { ...h, ...patch } : h));
      const removeHito = (id) => {
        const its = store.getIteracionesPorHito(proyectoId, id, { incluirArchivadas: true });
        const cuerpoExtra = its.length > 0
          ? `Este hito tiene ${its.length} ${its.length === 1 ? "iteración asociada" : "iteraciones asociadas"} — pasarán a "Sin hito". `
          : "";
        askConfirm({
          title: "Eliminar hito",
          body: `${cuerpoExtra}Esta acción no se puede deshacer.`,
          confirmText: "Eliminar",
          danger: true,

      };
      const addHito = () => {
        const nuevo = { id: genId("hito"), nombre: "Nuevo hito", fecha: todayISO(), descripcion: "", cumplido: false };
        setHitos([...proyecto.hitos, nuevo]);
        setEditandoId(nuevo.id);
      };
      const toggleCumplido = (h) => updateHito(h.id, { cumplido: !h.cumplido, fechaCumplido: !h.cumplido ? todayISO() : null });

      /* Pendientes en orden cronológico arriba; cumplidos al final manteniendo su orden por fecha. */
      const ordenados = proyecto.hitos.slice().sort((a, b) => {
        if (!!a.cumplido !== !!b.cumplido) return a.cumplido ? 1 : -1;
        return (a.fecha || "").localeCompare(b.fecha || "");
      });
      const pendientes = proyecto.hitos.filter(h => !h.cumplido).length;
      const cumplidosCount = proyecto.hitos.filter(h => h.cumplido).length;

      return (

                    {cumplidosCount > 0 && <> · <span style={{ color: C.green }}>{cumplidosCount} cumplido{cumplidosCount !== 1 ? "s" : ""}</span></>}
                  </>

                const atrasado = !cumplido && dias != null && dias < 0;

                              <div style={{ fontSize: 10, fontFamily: mono, color: C.textDim, marginTop: 4 }}>
                                {h.fecha || "—"}{cumplido && h.fechaCumplido && ` · cumplido ${h.fechaCumplido}`}
                                {(() => {
                                  const its = store.getIteracionesPorHito(proyectoId, h.id);

                                })()}
                              </div>
                            </div>
                            <span style={{ fontSize: 9, fontWeight: 700, color: dotColor, padding: "4px 9px", borderRadius: 12, background: `${dotColor}1a`, letterSpacing: 0.5, textTransform: "uppercase", whiteSpace: "nowrap" }}>{estadoLabel}</span>
                          </div>

                          {h.descripcion && (
                            <p style={{ fontSize: 13, color: C.textSec, lineHeight: 1.65, whiteSpace: "pre-wrap", marginTop: 10, marginBottom: 14 }}>{h.descripcion}</p>

                          <div style={{ display: "flex", gap: 8, marginTop: 12, paddingTop: h.descripcion ? 0 : 4, flexWrap: "wrap" }}>
                            <button onClick={() => toggleCumplido(h)} style={{ background: cumplido ? `${C.green}1a` : "transparent", border: `1px solid ${cumplido ? C.green : C.border}`, borderRadius: 6, padding: "5px 12px", fontSize: 11, fontWeight: 600, color: cumplido ? C.green : C.textSec, cursor: "pointer", fontFamily: font, letterSpacing: 0.3 }}>

    /* ─── Vista Planificación (calendario tipo Gantt con lane-packing) ─── */
    function VistaGantt({ store, onAbrirProyecto }) {
      const clientes = store.getClientes().filter(c => !c.archivado);
      const todos = clientes.flatMap(c => store.getProyectos(c.id).map(p => ({ ...p, _clienteNombre: c.nombre })));
      const proyectos = todos
        .filter(p => p.fechaAlta && p.fechaEntrega)
        .sort((a, b) => a.fechaAlta.localeCompare(b.fechaAlta));
      const sinFechas = todos.length - proyectos.length;

      if (proyectos.length === 0) {
        return (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h1 style={{ fontSize: 24, fontWeight: 700, color: C.white, letterSpacing: -0.5 }}>Planificación</h1>
              <p style={{ fontSize: 12, color: C.textDim, marginTop: 4 }}>Calendario de proyectos · superposiciones por carriles</p>
            </div>
            <Card>
              <div style={{ padding: "60px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 14, color: C.textSec, marginBottom: 8 }}>Sin proyectos para planificar</div>
                <div style={{ fontSize: 12, color: C.textDim }}>Crea un proyecto con fecha de alta y fecha de entrega para verlo aquí.</div>
                {sinFechas > 0 && <div style={{ fontSize: 11, color: C.textDim, marginTop: 14, fontFamily: mono, letterSpacing: 0.4, textTransform: "uppercase" }}>{sinFechas} proyecto{sinFechas !== 1 ? "s" : ""} sin fechas asignadas</div>}
              </div>
            </Card>
          </div>
        );
      }

      const parseDate = (iso) => new Date(iso + "T00:00:00Z");
      const dayMs = 86400000;

      let minD = parseDate(proyectos[0].fechaAlta);
      let maxD = parseDate(proyectos[0].fechaEntrega);
      proyectos.forEach(p => {
        const a = parseDate(p.fechaAlta), b = parseDate(p.fechaEntrega);
        if (a < minD) minD = a;
        if (b > maxD) maxD = b;
        (p.hitos || []).forEach(h => {
          if (h.fecha) {
            const d = parseDate(h.fecha);
            if (d < minD) minD = d;
            if (d > maxD) maxD = d;
          }
        });
      });

      /* Padding lateral de un mes a cada lado, snap al 1º del mes anterior y último día del mes posterior */
      const start = new Date(Date.UTC(minD.getUTCFullYear(), minD.getUTCMonth() - 1, 1));
      const end = new Date(Date.UTC(maxD.getUTCFullYear(), maxD.getUTCMonth() + 2, 0));
      const totalDays = Math.round((end - start) / dayMs) + 1;
      const dayWidth = Math.max(8, Math.min(22, 1100 / totalDays));
      const timelineWidth = totalDays * dayWidth;

      const today = parseDate(todayISO());
      const todayDay = Math.floor((today - start) / dayMs);
      const todayInRange = today >= start && today <= end;

      /* Eje superior: meses */
      const months = [];
      let cur = new Date(start);
      while (cur < end) {
        const next = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth() + 1, 1));
        const monthEnd = next > end ? end : next;
        months.push({
          label: cur.toLocaleString("es", { month: "short", timeZone: "UTC" }).replace(".", ""),
          year: cur.getUTCFullYear(),
          left: ((cur - start) / dayMs) * dayWidth,
          width: ((monthEnd - cur) / dayMs) * dayWidth,
          isFirstOfYear: cur.getUTCMonth() === 0,
        });
        cur = next;
      }

      /* Eje inferior: numeritos de día (1, 5, 10, 15, 20, 25) por mes */
      const dayLabels = [];
      months.forEach(m => {
        const monthStartDay = Math.round(m.left / dayWidth);
        const monthDays = Math.round(m.width / dayWidth);
        [5, 10, 15, 20, 25].forEach(d => {
          if (d <= monthDays) {
            dayLabels.push({ left: (monthStartDay + d - 1) * dayWidth, label: d, isMid: d === 15 });
          }
        });
      });

      /* Fines de semana: cada par sábado-domingo */
      const startDay = start.getUTCDay(); /* 0=Dom..6=Sab */
      const firstSat = (6 - startDay + 7) % 7;
      const weekends = [];
      for (let d = firstSat; d < totalDays; d += 7) {
        weekends.push({ left: d * dayWidth, width: Math.min(2, totalDays - d) * dayWidth });
      }

      /* Lunes para línea de inicio de semana */
      const firstMon = startDay === 1 ? 7 : (1 - startDay + 7) % 7;
      const mondays = [];
      for (let d = firstMon; d < totalDays; d += 7) mondays.push(d * dayWidth);

      /* Lane-packing: cada proyecto al lane más bajo libre por orden de fechaAlta */
      const lanesEnd = []; /* último endMs por lane */
      const projectLanes = new Map();
      for (const p of proyectos) {
        const startMs = parseDate(p.fechaAlta).getTime();
        const endMs = parseDate(p.fechaEntrega).getTime();
        let lane = lanesEnd.findIndex(e => e < startMs);
        if (lane === -1) { lane = lanesEnd.length; lanesEnd.push(0); }
        lanesEnd[lane] = endMs;
        projectLanes.set(p.id, lane);
      }
      const totalLanes = lanesEnd.length;

      const SALUD = {
        saludable: { color: C.green, label: "Saludable" },
        atencion: { color: C.amber, label: "Atención" },
        riesgo: { color: C.red, label: "Riesgo" },
      };

      const offsetOf = (iso) => ((parseDate(iso) - start) / dayMs) * dayWidth;
      const fmt = (iso) => parseDate(iso).toLocaleString("es", { month: "short", day: "numeric", timeZone: "UTC" }).replace(".", "");

      const LANE_H = 44;
      const BAR_H = 30;
      const HEADER_H = 56;
      const PAD_V = 16;
      const bodyH = totalLanes * LANE_H + PAD_V * 2;

      const rangeLabel = `${start.toLocaleString("es", { month: "short", year: "numeric", timeZone: "UTC" }).replace(".", "")} → ${end.toLocaleString("es", { month: "short", year: "numeric", timeZone: "UTC" }).replace(".", "")}`;

      const dayGridBg = `repeating-linear-gradient(to right, ${C.border}26 0px, ${C.border}26 1px, transparent 1px, transparent ${dayWidth}px)`;

      return (
        <div>
          <div style={{ marginBottom: 22, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 12 }}>
            <div>
              <h1 style={{ fontSize: 24, fontWeight: 700, color: C.white, letterSpacing: -0.5 }}>Planificación</h1>
              <p style={{ fontSize: 12, color: C.textDim, marginTop: 4 }}>
                <span style={{ color: C.textSec }}>{proyectos.length}</span> proyecto{proyectos.length !== 1 ? "s" : ""} en seguimiento
                {" · "}<span style={{ fontFamily: mono, letterSpacing: 0.3 }}>{rangeLabel}</span>
                {totalLanes > 1 && <span>{" · "}<span style={{ color: C.textSec }}>{totalLanes}</span> carriles paralelos</span>}
                {sinFechas > 0 && <span style={{ color: C.textDim }}>{" · "}{sinFechas} sin fechas</span>}
              </p>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 14, fontSize: 10, color: C.textDim, fontFamily: mono, letterSpacing: 0.5, textTransform: "uppercase" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}><Dot c={C.green} /> Saludable</span>
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}><Dot c={C.amber} /> Atención</span>
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}><Dot c={C.red} /> Riesgo</span>
              <span style={{ width: 1, height: 12, background: C.border }} />
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 7, height: 7, transform: "rotate(45deg)", background: C.white, borderRadius: 1 }} /> Hito
              </span>
            </div>
          </div>

          <Card style={{ padding: 0, overflow: "hidden", border: `1px solid ${C.border}` }}>
            <div style={{ overflowX: "auto", overflowY: "visible" }}>
              <div style={{ minWidth: timelineWidth, position: "relative" }}>

                {/* EJE de dos pisos */}
                <div style={{ position: "relative", height: HEADER_H, background: `linear-gradient(180deg, ${C.surface} 0%, ${C.surface2} 100%)`, borderBottom: `1px solid ${C.border}` }}>
                  {/* Piso 1 — meses */}
                  {months.map((m, i) => (
                    <div key={`m${i}`} style={{ position: "absolute", left: m.left, top: 0, height: 32, width: m.width, borderLeft: i > 0 ? `1px solid ${C.borderLight}` : "none", padding: "10px 0 0 10px", display: "flex", alignItems: "baseline", gap: 5 }}>
                      <span style={{ fontSize: 11, color: C.text, fontFamily: mono, letterSpacing: 0.7, textTransform: "uppercase", fontWeight: 700 }}>{m.label}</span>
                      {m.isFirstOfYear && <span style={{ fontSize: 9, color: C.textDim, fontFamily: mono, letterSpacing: 0.4 }}>{m.year}</span>}
                    </div>
                  ))}
                  {/* Piso 2 — numeritos de día */}
                  <div style={{ position: "absolute", left: 0, top: 32, right: 0, height: HEADER_H - 32, borderTop: `1px solid ${C.border}` }}>
                    {dayLabels.map((d, i) => (
                      <div key={`d${i}`} style={{ position: "absolute", left: d.left - 8, top: 0, height: HEADER_H - 32, width: 16, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <span style={{ fontSize: 9, color: d.isMid ? C.textSec : C.textDim, fontFamily: mono, letterSpacing: 0.3, fontWeight: d.isMid ? 600 : 400 }}>{d.label}</span>
                      </div>
                    ))}
                    {todayInRange && (
                      <div style={{ position: "absolute", left: todayDay * dayWidth - 14, top: 1, height: HEADER_H - 34, width: 30, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <span style={{ fontSize: 9, fontWeight: 700, color: C.accent, fontFamily: mono, letterSpacing: 0.5, background: C.bg, border: `1px solid ${C.accent}99`, borderRadius: 4, padding: "1px 6px", boxShadow: `0 0 8px ${C.accent}44` }}>HOY</span>
                      </div>
                    )}
                  </div>
                </div>

                {/* CUERPO con grid de calendario + lane-packed bars */}
                <div style={{ position: "relative", height: bodyH, background: C.surface }}>

                  {/* Sombreado de fines de semana */}
                  {weekends.map((w, i) => (
                    <div key={`we${i}`} style={{ position: "absolute", left: w.left, top: 0, width: w.width, height: bodyH, background: "rgba(0,0,0,0.22)", pointerEvents: "none" }} />
                  ))}

                  {/* Grid de día (línea sutil cada día) */}
                  <div style={{ position: "absolute", inset: 0, backgroundImage: dayGridBg, pointerEvents: "none" }} />

                  {/* Líneas de inicio de semana (lunes) */}
                  {mondays.map((left, i) => (
                    <div key={`mo${i}`} style={{ position: "absolute", left, top: 0, width: 1, height: bodyH, background: C.border, opacity: 0.7, pointerEvents: "none" }} />
                  ))}

                  {/* Líneas de mes */}
                  {months.slice(1).map((m, i) => (
                    <div key={`mb${i}`} style={{ position: "absolute", left: m.left, top: 0, width: 1, height: bodyH, background: C.borderLight, pointerEvents: "none" }} />
                  ))}

                  {/* Banda HOY (toda la altura) */}
                  {todayInRange && (
                    <div style={{ position: "absolute", left: todayDay * dayWidth, top: 0, width: dayWidth, height: bodyH, background: `${C.accent}1f`, borderLeft: `1px solid ${C.accent}88`, borderRight: `1px solid ${C.accent}55`, pointerEvents: "none", zIndex: 1 }} />
                  )}

                  {/* Barras de proyecto en sus lanes */}
                  {proyectos.map(p => {
                    const left = offsetOf(p.fechaAlta);
                    const width = Math.max(10, offsetOf(p.fechaEntrega) - left);
                    const lane = projectLanes.get(p.id);
                    const top = PAD_V + lane * LANE_H + (LANE_H - BAR_H) / 2;
                    const salud = SALUD[p.salud] || { color: C.textSec, label: p.salud };
                    return (
                      <GanttBar
                        key={p.id}
                        proyecto={p}
                        left={left}
                        width={width}
                        top={top}
                        salud={salud}
                        BAR_H={BAR_H}
                        offsetOf={offsetOf}
                        fmt={fmt}
                        onClick={() => onAbrirProyecto(p.id)}
                      />
                    );
                  })}
                </div>
              </div>
            </div>
          </Card>

          {sinFechas > 0 && (
            <div style={{ marginTop: 14, fontSize: 11, color: C.textDim, fontFamily: mono, letterSpacing: 0.4, textTransform: "uppercase" }}>
              · {sinFechas} proyecto{sinFechas !== 1 ? "s" : ""} oculto{sinFechas !== 1 ? "s" : ""} (sin fechas asignadas)
            </div>
          )}
        </div>
      );
    }

    function Dot({ c }) {
      return <span style={{ width: 7, height: 7, borderRadius: "50%", background: c, display: "inline-block", boxShadow: `0 0 6px ${c}88` }} />;
    }

    function GanttBar({ proyecto, left, width, top, salud, BAR_H, offsetOf, fmt, onClick }) {
      const [hover, setHover] = useState(false);
      const cumplidos = (proyecto.hitos || []).filter(h => h.cumplido).length;
      const totalHitos = (proyecto.hitos || []).length;
      const showFull = width > 200;
      const showMid = width > 110;
      const showMin = width > 50;
      return (
        <>
          <div
            onClick={onClick}
            onMouseEnter={() => setHover(true)}
            onMouseLeave={() => setHover(false)}
            title={`${proyecto.nombre} · ${proyecto._clienteNombre} · ${fmt(proyecto.fechaAlta)} → ${fmt(proyecto.fechaEntrega)}${totalHitos > 0 ? ` · ${cumplidos}/${totalHitos} hitos` : ""}`}
            style={{
              position: "absolute", left, top, width, height: BAR_H,
              background: `linear-gradient(180deg, ${salud.color}40 0%, ${salud.color}1f 100%)`,
              border: `1px solid ${salud.color}${hover ? "dd" : "88"}`,
              borderRadius: 6,
              boxShadow: hover ? `0 6px 18px rgba(0,0,0,0.4), 0 0 0 1px ${salud.color}44` : `0 1px 0 ${salud.color}28 inset`,
              transition: "border-color 0.15s ease, box-shadow 0.2s ease, transform 0.15s ease",
              transform: hover ? "translateY(-0.5px)" : "translateY(0)",
              overflow: "hidden",
              cursor: "pointer",
              zIndex: hover ? 4 : 2,
            }}
          >
            <div style={{ padding: "0 10px", height: "100%", display: "flex", alignItems: "center", gap: 8, whiteSpace: "nowrap" }}>
              {showFull ? (
                <>
                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: salud.color, boxShadow: `0 0 6px ${salud.color}`, flexShrink: 0 }} />
                  <span style={{ fontSize: 12, color: C.white, fontWeight: 700, letterSpacing: -0.1, overflow: "hidden", textOverflow: "ellipsis", minWidth: 0 }}>{proyecto.nombre}</span>
                  <span style={{ fontSize: 10, color: C.textSec, fontFamily: mono, letterSpacing: 0.4, textTransform: "uppercase", flexShrink: 1, overflow: "hidden", textOverflow: "ellipsis" }}>· {proyecto._clienteNombre}</span>
                  {totalHitos > 0 && (
                    <span style={{ marginLeft: "auto", fontSize: 9, color: salud.color, fontFamily: mono, letterSpacing: 0.4, textTransform: "uppercase", flexShrink: 0, paddingLeft: 8 }}>
                      {cumplidos}/{totalHitos} hitos
                    </span>
                  )}
                </>
              ) : showMid ? (
                <>
                  <span style={{ width: 5, height: 5, borderRadius: "50%", background: salud.color, flexShrink: 0 }} />
                  <span style={{ fontSize: 11, color: C.white, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", minWidth: 0 }}>{proyecto.nombre}</span>
                  {totalHitos > 0 && (
                    <span style={{ marginLeft: "auto", fontSize: 9, color: salud.color, fontFamily: mono, letterSpacing: 0.3, flexShrink: 0 }}>
                      {cumplidos}/{totalHitos}
                    </span>
                  )}
                </>
              ) : showMin ? (
                <span style={{ fontSize: 10, color: C.white, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis" }}>{proyecto.nombre}</span>
              ) : null}
            </div>
          </div>

          {/* Hitos como diamantes (eco del logo) anclados al borde superior de la barra */}
          {(proyecto.hitos || []).filter(h => h.fecha).map(h => {
            const hLeft = offsetOf(h.fecha);
            const cumplido = !!h.cumplido;
            return (
              <div
                key={h.id}
                title={`${h.nombre || "Hito"} · ${fmt(h.fecha)}${cumplido ? " · cumplido" : ""}`}
                style={{
                  position: "absolute", left: hLeft - 5, top: top - 5, width: 10, height: 10,
                  transform: "rotate(45deg)",
                  background: cumplido ? salud.color : C.white,
                  border: `1.5px solid ${cumplido ? salud.color : salud.color + "aa"}`,
                  boxShadow: `0 0 10px ${cumplido ? salud.color : "#fff"}99, 0 0 0 2px ${C.surface}`,
                  borderRadius: 1,
                  zIndex: hover ? 5 : 3,
                  pointerEvents: "none",
                }}
              />
            );
          })}
        </>
      );
    }

    /* ─── Vista Archivados ─── */
    function VistaArchivados({ store, onAbrirCliente, onVolver }) {
      const archivados = store.getClientes()
        .filter(c => c.archivado)
        .sort((a, b) => (b.fechaArchivado || "").localeCompare(a.fechaArchivado || ""));
      const saludColor = (s) => s === "saludable" ? C.green : s === "atencion" ? C.amber : C.red;
      const saludLabel = (s) => s === "saludable" ? "Saludable" : s === "atencion" ? "Atención" : "Riesgo";
      const restaurar = (cli) => store.updateCliente(cli.id, { archivado: false, fechaArchivado: null });
      const eliminar = (cli) => askConfirm({
        title: `Eliminar cliente "${cli.nombre}"`,
        body: "Se borrarán también todos sus proyectos e iteraciones. Esta acción no se puede deshacer.",
        confirmText: "Eliminar definitivamente",
        danger: true,
      }).then(ok => { if (ok) store.deleteCliente(cli.id); });

      const fmtFechaRel = (iso) => {
        if (!iso) return "—";
        const d = new Date(iso);
        const days = Math.floor((Date.now() - d.getTime()) / 86400000);
        if (days === 0) return "hoy";
        if (days === 1) return "ayer";
        if (days < 7) return `hace ${days} d`;
        if (days < 30) return `hace ${Math.floor(days / 7)} sem`;
        return d.toLocaleString("es", { month: "short", day: "numeric", year: "numeric" }).replace(".", "");
      };

      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 24 }}>
            <div>
              <h1 style={{ fontSize: 26, fontWeight: 700, color: C.white, letterSpacing: -0.6 }}>Archivados</h1>
              <p style={{ fontSize: 12, color: C.textDim, marginTop: 4 }}>
                {archivados.length} cliente{archivados.length !== 1 ? "s" : ""} archivado{archivados.length !== 1 ? "s" : ""} · ocultos del listado principal y de planificación
              </p>
            </div>
            <Btn onClick={onVolver}>← Volver a clientes</Btn>
          </div>

          {archivados.length === 0 ? (
            <Card>
              <div style={{ padding: "60px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 14, color: C.textSec, marginBottom: 8 }}>No hay clientes archivados</div>
                <div style={{ fontSize: 12, color: C.textDim }}>Archiva un cliente desde la página principal con el menú ⋯ de su tarjeta.</div>
              </div>
            </Card>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 16 }}>
              {archivados.map(cli => {
                const m = getMetricasCliente(store, cli.id);
                return (
                  <ArchivadoCard
                    key={cli.id}
                    cli={cli}
                    metricas={m}
                    onAbrir={() => onAbrirCliente(cli.id)}
                    onRestaurar={() => restaurar(cli)}
                    onEliminar={() => eliminar(cli)}
                    saludColor={saludColor}
                    saludLabel={saludLabel}
                    fmtFechaRel={fmtFechaRel}
                  />
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function ArchivadoCard({ cli, metricas, onAbrir, onRestaurar, onEliminar, saludColor, saludLabel, fmtFechaRel }) {
      const [hover, setHover] = useState(false);
      const m = metricas;
      return (
        <div
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => setHover(false)}
          style={{
            background: C.surface, border: `1px solid ${hover ? C.borderLight : C.border}`,
            borderRadius: 12, padding: 18, opacity: hover ? 1 : 0.85,
            transition: "border-color 0.15s ease, opacity 0.15s ease",
            position: "relative",
          }}
        >
          {/* Banner de archivado */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, fontSize: 9, fontFamily: mono, letterSpacing: 0.6, textTransform: "uppercase", color: C.textDim }}>
            <span>archivado · {fmtFechaRel(cli.fechaArchivado)}</span>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 5, color: saludColor(m.salud) }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: saludColor(m.salud) }} /> {saludLabel(m.salud)}
            </span>
          </div>
          <div style={{ fontSize: 16, fontWeight: 700, color: hover ? C.white : C.text, letterSpacing: -0.3, marginBottom: 4, cursor: "pointer" }} onClick={onAbrir}>{cli.nombre}</div>
          {cli.notas && <div style={{ fontSize: 11, color: C.textDim, marginBottom: 12, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{cli.notas}</div>}
          <div style={{ display: "flex", gap: 16, paddingTop: 12, borderTop: `1px solid ${C.border}`, marginBottom: 14 }}>
            <div><span style={{ fontFamily: mono, fontSize: 14, fontWeight: 700, color: C.textSec }}>{m.numProyectos}</span> <span style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.5 }}>proyectos</span></div>
            <div><span style={{ fontFamily: mono, fontSize: 14, fontWeight: 700, color: C.textSec }}>{m.pendientes + m.proceso}</span> <span style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.5 }}>iteraciones abiertas</span></div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <Btn kind="primary" onClick={onRestaurar}>↺ Restaurar</Btn>
            <div style={{ flex: 1 }} />
            <Btn kind="danger" onClick={onEliminar}>Eliminar</Btn>
          </div>
        </div>
      );
    }

    function App() {
      const s = useStore(store);
      const [route, setRoute] = useState({ view: "home" });
      const [modalNuevoCli, setModalNuevoCli] = useState(false);
      const [modalEditarCli, setModalEditarCli] = useState(false);
      const [modalNuevoProy, setModalNuevoProy] = useState(false);
      const [modalFichaCompleta, setModalFichaCompleta] = useState(false);
      const team = useTeam();
      const equipo = teamToMembers(team);
      const me = useCurrentUser();
      const usuarioActual = me ? {
        id: me.username,
        nombre: me.name,
        iniciales: me.name ? me.name.trim().split(/\s+/).map(seg => seg[0] || '').join('').slice(0,2).toUpperCase() : '??',
        rol: me.role === 'admin' ? 'admin' : 'member',
        color: me.color,
        gmail: me.username,
      } : null;

      if (!usuarioActual) {
        return <div style={{ padding: 32, color: C.textDim, fontFamily: font }}>Cargando…</div>;
      }

      const goHome = () => setRoute({ view: "home" });
      const goCliente = (clienteId) => setRoute({ view: "cliente", clienteId });
      const goProyecto = (proyectoId, opts) => {
        const proy = s.getProyecto(proyectoId);
        if (proy) setRoute({ view: "proyecto", clienteId: proy.clienteId, proyectoId, opts: opts || null });
      };
      const goEquipo = () => setRoute({ view: "equipo" });
      const goPlanificacion = () => setRoute({ view: "planificacion" });
      const goArchivados = () => setRoute({ view: "archivados" });
      const goHitos = (proyectoId) => {
        const proy = s.getProyecto(proyectoId);
        setRoute({ view: "hitos", clienteId: proy.clienteId, proyectoId });
      };

      const resetear = () => {
        askConfirm({
          title: "Resetear todos los datos",
          body: "Volverá al estado inicial (seed). Se perderán los cambios locales. Esta acción no se puede deshacer.",
          confirmText: "Resetear",
          danger: true,
        }).then(ok => { if (ok) { s.reset(); goHome(); } });
      };

      const trail = [{ label: "Clientes", to: { view: "home" } }];
      if (route.view === "equipo") trail.push({ label: "Equipo", to: { view: "equipo" } });
      if (route.view === "planificacion") trail.push({ label: "Planificación", to: { view: "planificacion" } });
      if (route.view === "archivados") trail.push({ label: "Archivados", to: { view: "archivados" } });
      if (route.view === "cliente" || route.view === "proyecto" || route.view === "hitos") {
        const cli = s.getCliente(route.clienteId);
        if (cli) trail.push({ label: cli.nombre, to: { view: "cliente", clienteId: cli.id } });
      }
      if (route.view === "proyecto" || route.view === "hitos") {
        const proy = s.getProyecto(route.proyectoId);
        if (proy) trail.push({ label: proy.nombre, to: { view: "proyecto", clienteId: proy.clienteId, proyectoId: proy.id } });
      }
      if (route.view === "hitos") trail.push({ label: "Hitos", to: { view: "hitos", clienteId: route.clienteId, proyectoId: route.proyectoId } });

      return (
        <div style={{ background: C.bg, minHeight: "100vh", color: C.text }}>
          <Header
            usuarioActual={usuarioActual}
            onIrEquipo={goEquipo}
            onIrPlanificacion={goPlanificacion}
            onIrArchivados={goArchivados}
            onResetear={resetear}
            route={route.view}
            archivadosCount={s.getClientes().filter(c => c.archivado).length}
          />
          {store.isSaving() && (
            <div style={{ position: "fixed", top: 12, right: 16, zIndex: 1000, padding: "4px 10px", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 4, color: C.textSec, fontFamily: mono, fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase" }}>
              Guardando…
            </div>
          )}
          {store.saveError() && (
            <div style={{ position: "fixed", top: 12, right: 16, zIndex: 1000, padding: "6px 12px", background: C.redBg, border: `1px solid ${C.red}`, borderRadius: 4, color: C.red, fontFamily: mono, fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", cursor: "pointer" }}
              onClick={() => store.retryLastSave().catch(()=>{})}>
              Error guardando — click para reintentar
            </div>
          )}
          <Breadcrumb trail={trail} onNav={(t) => setRoute(t.to)} />
          <main className="crux-main" style={{ padding: "28px 32px", maxWidth: 1280, margin: "0 auto" }}>
            {route.view === "home" && (
              <HomeClientes store={s} onAbrirCliente={goCliente} onNuevoCliente={() => setModalNuevoCli(true)} />
            )}
            {route.view === "cliente" && (
              <VistaCliente
                store={s}
                clienteId={route.clienteId}
                onAbrirProyecto={goProyecto}
                onNuevoProyecto={() => setModalNuevoProy(true)}
                onEditarCliente={() => setModalEditarCli(true)}
              />
            )}
            {route.view === "proyecto" && (
              <VistaProyecto
                key={route.proyectoId}
                store={s}
                proyectoId={route.proyectoId}
                onVerFichaCompleta={() => setModalFichaCompleta(true)}
                onVerHitos={() => goHitos(route.proyectoId)}
                usuarioActual={usuarioActual}
                routeOpts={route.opts}
              />
            )}
            {route.view === "hitos" && (
              <VistaHitos
                store={s}
                proyectoId={route.proyectoId}
                onVolver={() => goProyecto(route.proyectoId)}
                onVerIteracionesDeHito={(hitoId) => goProyecto(route.proyectoId, { viewMode: "porHito", filtroHitoId: hitoId })}
              />
            )}
            {route.view === "equipo" && (
              <VistaEquipo equipo={equipo} onVolver={goHome} />
            )}
            {route.view === "planificacion" && (
              <VistaGantt store={s} onAbrirProyecto={goProyecto} />
            )}
            {route.view === "archivados" && (
              <VistaArchivados store={s} onAbrirCliente={goCliente} onVolver={goHome} />
            )}
          </main>
          <NuevoClienteModal open={modalNuevoCli} onClose={() => setModalNuevoCli(false)} onCrear={(d) => s.addCliente(d)} />
          <EditarClienteModal
            open={modalEditarCli}
            onClose={() => setModalEditarCli(false)}
            cliente={route.view === "cliente" ? s.getCliente(route.clienteId) : null}
            onGuardar={(d) => s.updateCliente(route.clienteId, d)}
            onEliminar={() => { s.deleteCliente(route.clienteId); goHome(); }}
          />
          <NuevoProyectoModal
            open={modalNuevoProy}
            onClose={() => setModalNuevoProy(false)}
            equipo={equipo}
            onCrear={(d) => s.addProyecto(route.clienteId, d)}
          />
          <FichaCompletaModal
            open={modalFichaCompleta}
            onClose={() => setModalFichaCompleta(false)}
            proyecto={route.view === "proyecto" ? s.getProyecto(route.proyectoId) : null}
            equipo={equipo}
            onGuardar={(d) => s.updateProyecto(route.proyectoId, d)}
            onEliminar={() => { s.deleteProyecto(route.proyectoId); goCliente(route.clienteId); }}
          />
          <ConfirmDialog />
        </div>
      );
    }

    /* Veil de carga de datos (mostrar mientras hidratamos desde KV) */
    function LoadingVeil() {
      return (
        <div style={{ position: "fixed", inset: 0, background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: mono, fontSize: 11, letterSpacing: "0.25em", textTransform: "uppercase", color: C.accent }}>
          Cargando datos…
        </div>
      );
    }

    function ErrorVeil({ msg, onRetry }) {
      return (
        <div style={{ position: "fixed", inset: 0, background: C.bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 20, padding: 32, textAlign: "center", color: C.text }}>
          <div style={{ fontFamily: mono, fontSize: 10, letterSpacing: "0.25em", textTransform: "uppercase", color: C.red }}>Error cargando datos</div>
          <div style={{ fontFamily: font, fontSize: 13, color: C.textSec, maxWidth: 420 }}>{msg}</div>
          <button onClick={onRetry} style={{ marginTop: 8, padding: "10px 20px", background: "transparent", border: `1px solid ${C.accent}`, borderRadius: 3, color: C.accent, fontFamily: mono, fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", cursor: "pointer" }}>
            Recargar
          </button>
        </div>
      );
    }

    const __root = ReactDOM.createRoot(document.getElementById("root"));
    __root.render(<LoadingVeil />);
    store.hydrate()
      .then(() => { __root.render(<App />); })
      .catch((err) => {
        console.error('[comm-store] hydrate failed, refusing to mount App', err);
        __root.render(<ErrorVeil msg={String(err && err.message || err)} onRetry={() => window.location.reload()} />);
      });
  </script>
</body>
</html>
